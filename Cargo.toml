# FrankenGraphDB workspace root.
#
# Constitutional context (AGENTS.md doctrine, plan §18):
#   - `fgdb-*` engine crates appear only with their first real final-abstraction
#     slice (fgdb-g0-workspace-topology-1q9m). No empty prototype crates.
#   - `tools/registry-check` is G0 constitutional tooling, not an engine crate:
#     it validates the claim registries under `registries/` and is deliberately
#     std-only (the closed dependency universe applies to the tooling that
#     enforces it).
#   - Workspace-level `unsafe_code = "forbid"`; only the (future) named
#     `fgdb-unsafe-*` boundary crates may relax to `deny` + ledgered allows.

[workspace]
resolver = "3"
members = [
    "crates/fgdb",
    "crates/fgdb-beacon",
    "crates/fgdb-bigint",
    "crates/fgdb-calibrate",
    "crates/fgdb-chronicle",
    "crates/fgdb-claim",
    "crates/fgdb-cli",
    "crates/fgdb-codec",
    "crates/fgdb-collections",
    "crates/fgdb-crypto",
    "crates/fgdb-delta-types",
    "crates/fgdb-evidence",
    "crates/fgdb-gql",
    "crates/fgdb-order",
    "crates/fgdb-policy",
    "crates/fgdb-prism",
    "crates/fgdb-protocol",
    "crates/fgdb-reference",
    "crates/fgdb-repl",
    "crates/fgdb-resource",
    "crates/fgdb-sim",
    "crates/fgdb-sketch",
    "crates/fgdb-strata",
    "crates/fgdb-types",
    "crates/fgdb-unsafe-arena",
    "crates/fgdb-unsafe-simd",
    "crates/fgdb-unsafe-vfs",
    "crates/fgdb-warden",
    "crates/fgdb-bench",
    "tools/registry-check",
]

[workspace.package]
edition = "2024"

[workspace.lints.rust]
unsafe_code = "forbid"
# Measured residual (fgdb-gate-weakening-rollback-mthlh): 8 sites / 8 files.
recursion_depth_exceeding_limit = "allow"

[workspace.lints.clippy]
# Justified by the 08-27 toolchain bump (088e510f):
# #[must_use] on functions already returning a must_use type; cosmetic.
double_must_use = "allow"
# Index walks over parallel slices by a single counter; an iterator rewrite would
# obscure the arithmetic without changing behaviour.
needless_range_loop = "allow"
# MEASURED RESIDUAL, not a justification (fgdb-gate-weakening-rollback-mthlh).
# 89b49d38 and 21ccbfd7 added 27 workspace allows without evidence. 8ae77715
# removed the six correctness/suspicious/perf ones; the next commit removed the
# ten other style lints with at most 3 sites each (manual_next_back had none),
# each site fixed or allowed locally with a reason. manual_noop_waker (13 sites),
# then err_expect (30), unnecessary_mut_passed (18), manual_is_multiple_of (14),
# unusual_byte_groupings (44) and collapsible_if (38) followed as fixed code, and
# too_many_arguments (9) as site-local allows with reasons. The rest remain
# (unique sites at 2026-09-25, workspace --all-targets). Each is to become fixed
# code or a site-local allow with a reason, never a new workspace entry.
result_large_err = "allow" # 263 sites / 48 files
# 15 of its sites are one repeated WriteTxn error-family Result; that wants a
# shared alias, which touches public signatures, so it is a slice of its own.
type_complexity = "allow" # 34 / 24
# Its 13 sites are `Option::<T>::None.expect(msg)` stand-ins for panic!: fixing
# them moves the UBS panic-macro ratchet, so that decision rides separately.
unnecessary_literal_unwrap = "allow" # 13 / 3

