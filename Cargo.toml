# FrankenGraphDB workspace root.
#
# Constitutional context (AGENTS.md doctrine, plan §18):
#   - `fgdb-*` engine crates appear only with their first real final-abstraction
#     slice (fgdb-g0-workspace-topology-1q9m). No empty prototype crates.
#   - `tools/registry-check` is G0 constitutional tooling, not an engine crate:
#     it validates the claim registries under `registries/` and is deliberately
#     std-only (the closed dependency universe applies to the tooling that
#     enforces it).
#   - Workspace-level `unsafe_code = "forbid"`; only the (future) named
#     `fgdb-unsafe-*` boundary crates may relax to `deny` + ledgered allows.

[workspace]
resolver = "3"
members = [
    "crates/fgdb",
    "crates/fgdb-bigint",
    "crates/fgdb-calibrate",
    "crates/fgdb-chronicle",
    "crates/fgdb-claim",
    "crates/fgdb-codec",
    "crates/fgdb-collections",
    "crates/fgdb-crypto",
    "crates/fgdb-delta-types",
    "crates/fgdb-evidence",
    "crates/fgdb-gql",
    "crates/fgdb-reference",
    "crates/fgdb-resource",
    "crates/fgdb-sim",
    "crates/fgdb-sketch",
    "crates/fgdb-strata",
    "crates/fgdb-types",
    "crates/fgdb-unsafe-arena",
    "crates/fgdb-unsafe-simd",
    "crates/fgdb-unsafe-vfs",
    "crates/fgdb-bench",
    "tools/registry-check",
]

[workspace.package]
edition = "2024"

[workspace.lints.rust]
unsafe_code = "forbid"
recursion_depth_exceeding_limit = "allow"

[workspace.lints.clippy]
# Absorbs lint families newer nightlies fire on unchanged, correct code here.
# Correctness/suspicious/perf stay denied via the CI `-D warnings` gate.
# #[must_use] on functions already returning a must_use type; cosmetic.
double_must_use = "allow"
# Index walks over parallel slices by a single counter; an iterator rewrite would
# obscure the arithmetic without changing behaviour.
needless_range_loop = "allow"
# Result errors can exceed 128 bytes due to rich diagnostic context in enum variants.
result_large_err = "allow"
# Style lints newer nightlies fire on unchanged, correct code
type_complexity = "allow"
too_many_arguments = "allow"
collapsible_if = "allow"
collapsible_match = "allow"
map_entry = "allow"
manual_is_multiple_of = "allow"
chunks_exact_to_as_chunks = "allow"
single_char_add_str = "allow"
unusual_byte_groupings = "allow"
mistyped_literal_suffixes = "allow"
unnecessary_mut_passed = "allow"
redundant_pattern_matching = "allow"
unnecessary_literal_unwrap = "allow"
expect_fun_call = "allow"
unnecessary_cast = "allow"
doc_lazy_continuation = "allow"
manual_next_back = "allow"
len_zero = "allow"
match_like_matches_macro = "allow"
large_enum_variant = "allow"
err_expect = "allow"
cloned_ref_to_slice_refs = "allow"
unnecessary_get_then_check = "allow"

