[package]
name = "fgdb-sim"
version = "0.0.1"
edition = "2024"
description = "The database under asupersync's lab runtime (plan §15): virtual time, seeded deterministic scheduling, and crash injection. This increment lands the durability-versus-semantics differential — a commit stream crashed at every protocol instant, recovered, and materialized through the reference oracle; bead fgdb-verif-sim-q97e."
publish = false

[lints]
workspace = true

[dependencies]
# The composition-layer engine (fgdb-j0vu, then fgdb-khec).
#
# PROMOTED from a dev-dependency to a normal one, deliberately. It began as a
# dev-dep so only the spine differential could see it; then fgdb-khec moved the
# capsule-commit vocabulary to its real home in `fgdb`, and this crate's own
# `replay` needs `template_digest` to verify what a marker committed to. A lib
# cannot use a dev-dependency, so the edge has to be real.
#
# This does NOT weaken §15.2. That rule constrains `fgdb-reference` — the oracle
# must not import the engine — and it is untouched. This crate is explicitly the
# one place the plan says both may be visible. Layer direction permits it:
# composition is 13, verification is 14.
fgdb = { path = "../fgdb" }
asupersync = { git = "https://github.com/Dicklesworthstone/asupersync", rev = "3b34c9b0a14c55eb814cf4aaeceeba3be0c0a72e", default-features = false }
fgdb-calibrate = { path = "../fgdb-calibrate" }
fgdb-chronicle = { path = "../fgdb-chronicle" }
fgdb-crypto = { path = "../fgdb-crypto" }
fgdb-delta-types = { path = "../fgdb-delta-types" }
fgdb-reference = { path = "../fgdb-reference" }
# The verification layer is where an engine tier and the oracle may both be
# visible — §15.2 keeps them apart inside fgdb-reference precisely so the
# differential cannot be gutted by code sharing, and this is the crate the plan
# names for running it.
fgdb-strata = { path = "../fgdb-strata" }
fgdb-types = { path = "../fgdb-types" }
