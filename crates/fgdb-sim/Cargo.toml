[package]
name = "fgdb-sim"
version = "0.0.1"
edition = "2024"
description = "The database under asupersync's lab runtime (plan §15): virtual time, seeded deterministic scheduling, and crash injection. This increment lands the durability-versus-semantics differential — a commit stream crashed at every protocol instant, recovered, and materialized through the reference oracle; bead fgdb-verif-sim-q97e."
publish = false

[lints]
workspace = true

[dependencies]
asupersync = { git = "https://github.com/Dicklesworthstone/asupersync", rev = "3e8d08efe6617e08635fa8705c62a2a531373f43", default-features = false }
fgdb-chronicle = { path = "../fgdb-chronicle" }
fgdb-crypto = { path = "../fgdb-crypto" }
fgdb-delta-types = { path = "../fgdb-delta-types" }
fgdb-reference = { path = "../fgdb-reference" }
# The verification layer is where an engine tier and the oracle may both be
# visible — §15.2 keeps them apart inside fgdb-reference precisely so the
# differential cannot be gutted by code sharing, and this is the crate the plan
# names for running it.
fgdb-strata = { path = "../fgdb-strata" }
fgdb-types = { path = "../fgdb-types" }
