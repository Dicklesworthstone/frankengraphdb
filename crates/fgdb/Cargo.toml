[package]
name = "fgdb"
version = "0.0.1"
edition = "2024"
description = "The embedded FrankenGraphDB library (plan §1 constraint 5(a), §13.1). This increment lands THE SPINE: the first composition of Chronicle's durable commit stream and Strata's tier-D adjacency behind a surface a person can run — open, write, read neighbours, drop, reopen. Deliberately a SUBSET of the full embedded API; bead fgdb-j0vu."
publish = false

[lints]
workspace = true

[dependencies]
asupersync = { git = "https://github.com/Dicklesworthstone/asupersync", rev = "3b34c9b0a14c55eb814cf4aaeceeba3be0c0a72e", default-features = false }
fgdb-chronicle = { path = "../fgdb-chronicle" }
fgdb-crypto = { path = "../fgdb-crypto" }
fgdb-delta-types = { path = "../fgdb-delta-types" }
fgdb-strata = { path = "../fgdb-strata" }
fgdb-types = { path = "../fgdb-types" }
