[package]
name = "fgdb-strata"
version = "0.0.1"
edition = "2024"
description = "Strata (B2): the graph-structured LSM. This activation lands tier one's durable artifact — the canonical delta-block format: a sorted, versioned adjacency run with an exact byte layout, a fail-closed decoder, and snapshot-visible scans read from the encoded form. Sealing, compressed CSR runs, archived anchors and the stable-ID directory are not here; bead fgdb-w3-tier-d-ctj."
publish = false

# §5.1's keyed logical object identity, so a block is content-addressed the same
# way every other durable object is rather than by a private hash.
[dependencies.fgdb-crypto]
path = "../fgdb-crypto"

[dependencies.fgdb-types]
path = "../fgdb-types"

[dependencies.fgdb-delta-types]
path = "../fgdb-delta-types"

# Tier-D V3 frames the two §6.2 identity columns with this production codec.
# The format owns the codec ID, row count, prefix count, and payload length;
# `fgdb-codec` intentionally owns only the registry-independent scalar payload.
[dependencies.fgdb-codec]
path = "../fgdb-codec"

[lints]
workspace = true

[dev-dependencies.fgdb-delta-types]
path = "../fgdb-delta-types"

# TESTS ONLY, AND DELIBERATELY NOT A REAL DEPENDENCY YET. `fgdb-codec::identity`
# is the registered identity-column codec §6.2 requires for block entries, and
# this crate does not use it — the byte-economy witnesses in
# tests/delta_block_format.rs measure what adopting it would actually buy, by
# running the real codec rather than by arithmetic. The production dependency
# lands with the format change itself (fgdb-by2l), not before: a dev-dependency
# cannot be mistaken for adoption.
# The lab runtime, for tests only: the block store is the first thing in this
# crate that touches a disk, so its laws must run under the runtime that can
# inject fsync lies and torn writes at that boundary.
[dev-dependencies.asupersync]
git = "https://github.com/Dicklesworthstone/asupersync"
rev = "9f7c37697dd92022b5cf9dbc574f9a5a44fce417"
default-features = false
