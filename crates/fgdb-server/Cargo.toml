[package]
name = "fgdb-server"
version = "0.0.1"
edition = "2024"
description = "fgdbd: FrankenGraphDB's server posture (plan §13). Composes the embedded engine behind fgdb-protocol's FGP connection machine over asupersync TCP, with Warden capability authentication and per-statement authorized sessions."
publish = false

[[bin]]
name = "fgdbd"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
asupersync = { git = "https://github.com/Dicklesworthstone/asupersync", rev = "78b64636e99fea4ea2d868096576021dd3b8e519", version = "=0.5.0", default-features = false }
fgdb = { path = "../fgdb" }
fgdb-crypto = { path = "../fgdb-crypto" }
fgdb-delta-types = { path = "../fgdb-delta-types" }
fgdb-gql = { path = "../fgdb-gql" }
fgdb-protocol = { path = "../fgdb-protocol", features = ["transport"] }
fgdb-types = { path = "../fgdb-types" }
fgdb-warden = { path = "../fgdb-warden" }
