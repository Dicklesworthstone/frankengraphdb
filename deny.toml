# Dependency policy for the complete workspace graph.  This file deliberately
# does not choose versions: Cargo.toml and Cargo.lock remain the authorities for
# exact foundation revisions and transitive resolution.

[graph]
all-features = true

[licenses]
include-dev = true
unused-allowed-license = "deny"
confidence-threshold = 0.8
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-1-Clause",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "MIT",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
exceptions = [
  { crate = "asupersync", allow = ["LicenseRef-MIT-OpenAI-Anthropic-Rider"] },
  { crate = "fnx-algorithms", allow = ["LicenseRef-MIT-OpenAI-Anthropic-Rider"] },
  { crate = "fnx-cgse", allow = ["LicenseRef-MIT-OpenAI-Anthropic-Rider"] },
  { crate = "fnx-classes", allow = ["LicenseRef-MIT-OpenAI-Anthropic-Rider"] },
  { crate = "fnx-generators", allow = ["LicenseRef-MIT-OpenAI-Anthropic-Rider"] },
  { crate = "fnx-runtime", allow = ["LicenseRef-MIT-OpenAI-Anthropic-Rider"] },
  { crate = "franken-decision", allow = ["LicenseRef-MIT-OpenAI-Anthropic-Rider"] },
  { crate = "franken-evidence", allow = ["LicenseRef-MIT-OpenAI-Anthropic-Rider"] },
  { crate = "franken-kernel", allow = ["LicenseRef-MIT-OpenAI-Anthropic-Rider"] },
]

# The pinned franken_networkx revision declares license-file rather than a
# machine-readable SPDX expression. Bind the interpretation to the exact bytes
# of that revision's license so a license-text change fails closed.
[[licenses.clarify]]
crate = "fnx-classes"
expression = "LicenseRef-MIT-OpenAI-Anthropic-Rider"
license-files = [{ path = "../../LICENSE", hash = 0x3e2e0c66 }]

[[licenses.clarify]]
crate = "fnx-generators"
expression = "LicenseRef-MIT-OpenAI-Anthropic-Rider"
license-files = [{ path = "../../LICENSE", hash = 0x3e2e0c66 }]

[[licenses.clarify]]
crate = "fnx-runtime"
expression = "LicenseRef-MIT-OpenAI-Anthropic-Rider"
license-files = [{ path = "../../LICENSE", hash = 0x3e2e0c66 }]

# fnx-algorithms and fnx-cgse joined the graph with fgdb-prism (same pinned
# franken_networkx revision, same LICENSE bytes). They are listed after
# fnx-classes so the license-mismatch control keeps mutating fnx-classes.
[[licenses.clarify]]
crate = "fnx-algorithms"
expression = "LicenseRef-MIT-OpenAI-Anthropic-Rider"
license-files = [{ path = "../../LICENSE", hash = 0x3e2e0c66 }]

[[licenses.clarify]]
crate = "fnx-cgse"
expression = "LicenseRef-MIT-OpenAI-Anthropic-Rider"
license-files = [{ path = "../../LICENSE", hash = 0x3e2e0c66 }]

[licenses.private]
# Every workspace package is publish=false. Their distribution policy belongs
# to the product-release workstream; this gate judges third-party inputs.
ignore = true

[bans]
multiple-versions = "warn"
# cargo-deny calls version-less path dependencies and exact-rev git
# dependencies wildcards. The source policy below separately requires rev pins
# and permits only the two foundation repositories.
wildcards = "allow"
highlight = "all"
# Doctrine #1 (AGENTS.md): "No serde, no tokio, no rocksdb, no arrow, no
# tantivy, no hnswlib. Ever." topology-check already refuses any new DIRECT
# third-party dependency in a first-party crate. These bans close the
# transitive route: a foundation bump that pulls one of these crates in.
#
# Crates absent from Cargo.lock today are denied outright; any appearance
# fails. The serde family is present today only through the foundations and
# their own dependencies, so each carries `wrappers`: the exact set of crates
# that depend on it directly as of this lockfile. A new direct dependent,
# first-party or reached through a foundation bump, fails and must be reviewed
# rather than absorbed (fgdb-deny-transitive-bans-wzw0x).
deny = [
  { crate = "tokio", reason = "doctrine #1: no tokio; asupersync is the runtime" },
  { crate = "rocksdb", reason = "doctrine #1: no rocksdb; Strata is the storage engine" },
  { crate = "librocksdb-sys", reason = "doctrine #1: no rocksdb" },
  { crate = "arrow", reason = "doctrine #1: no arrow; columnar readers are built in-house" },
  { crate = "arrow2", reason = "doctrine #1: no arrow" },
  { crate = "tantivy", reason = "doctrine #1: no tantivy; Beacon builds FTS in-house" },
  { crate = "hnsw", reason = "doctrine #1: no hnswlib; Beacon builds ANN in-house" },
  { crate = "hnsw_rs", reason = "doctrine #1: no hnswlib" },
  { crate = "serde", wrappers = [
    "asupersync", "bincode-next", "fnx-algorithms", "fnx-cgse", "fnx-classes",
    "fnx-runtime", "franken-decision", "franken-evidence", "franken-kernel",
    "rmp-serde", "semver", "serde_json",
  ], reason = "doctrine #1: no serde in first-party code; foundation-transitive only" },
  { crate = "serde_derive", wrappers = ["serde", "serde_core"], reason = "doctrine #1: serde family, foundation-transitive only" },
  { crate = "serde_core", wrappers = ["semver", "serde", "serde_json"], reason = "doctrine #1: serde family, foundation-transitive only" },
  { crate = "serde_json", wrappers = ["asupersync", "fnx-cgse", "fnx-runtime", "franken-evidence"], reason = "doctrine #1: serde family, foundation-transitive only" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
required-git-spec = "rev"
unused-allowed-source = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
  "https://github.com/Dicklesworthstone/asupersync",
  "https://github.com/Dicklesworthstone/franken_networkx",
]
