# Parallel rustc front-end (nightly). Added by build-settings sweep.
[build]
rustflags = ["-Z", "threads=4"]

# Crashpacks and regression bundles must survive `cargo clean`
# (fgdb-crashpack-artifacts-durable-home-vd35). asupersync's lab runtime reads
# ASUPERSYNC_TEST_ARTIFACTS_DIR lazily and falls back to a CWD-relative
# `target/test-artifacts`, which cargo resolves INSIDE each crate's cleanable
# target/ directory. Pin the durable root here so failing-test crashpacks and
# replay bundles land under <workspace>/artifacts/test/... and the replay
# commands printed in panic tails stay valid after a clean. `force` stays
# false (the [env] default), so an explicit operator export still wins — this
# pin changes only the silent default.
[env]
ASUPERSYNC_TEST_ARTIFACTS_DIR = { value = "artifacts/test", relative = true }

# fgdb-epic-verif-phi.3: ring emits full native macro debug information even
# under Rust's line-table profile. Large test links exceed DWARF32 string
# offsets; widen the native ELF debug format instead of discarding that data.
# Supplying CFLAGS disables cc-rs's implicit warning groups, so retain both.
# Other target triples keep their defaults; an explicit same-key export wins.
CFLAGS_x86_64_unknown_linux_gnu = { value = "-Wall -Wextra -gdwarf64", force = false }
