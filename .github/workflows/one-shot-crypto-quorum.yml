name: One-shot crypto timing quorum hardening

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-crypto-quorum.yml

permissions:
  contents: write

concurrency:
  group: one-shot-crypto-quorum
  cancel-in-progress: false

jobs:
  harden:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace only the timing quorum policy
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("crates/fgdb-crypto/tests/constant_time_audit.rs")
          text = path.read_text()
          replacements = [
              (
                  "    /// Three independent, identically-shaped screens are measured under one\n"
                  "    /// process-wide lock. Two of three must pass the unchanged production\n"
                  "    /// bounds. A load episode can poison one screen; it cannot silently weaken\n"
                  "    /// the bounds or turn one lucky screen into a proof.\n",
                  "    /// Five independent, identically-shaped screens are measured under one\n"
                  "    /// process-wide lock. Three of five must pass the unchanged production\n"
                  "    /// bounds. Up to two load episodes can poison screens; they cannot silently\n"
                  "    /// weaken the bounds or turn one lucky screen into a proof.\n",
              ),
              ("    const SCREENS: usize = 3;", "    const SCREENS: usize = 5;"),
              (
                  "    // Two of three tolerates one load episode without weakening either bound.",
                  "    // Three of five tolerates two load episodes without weakening either bound.",
              ),
              (
                  "    const PRODUCTION_PASS_QUORUM: usize = 2;",
                  "    const PRODUCTION_PASS_QUORUM: usize = 3;",
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one occurrence, found {count}: {old!r}")
              text = text.replace(old, new)
          path.write_text(text)
          PY
          git diff --check
          git diff -- crates/fgdb-crypto/tests/constant_time_audit.rs
          grep -F 'const SCREENS: usize = 5;' crates/fgdb-crypto/tests/constant_time_audit.rs
          grep -F 'const PRODUCTION_PASS_QUORUM: usize = 3;' crates/fgdb-crypto/tests/constant_time_audit.rs

      - name: Run the strengthened timing detector
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p fgdb-crypto --test constant_time_audit \
            aead_forgery_timing_probe_is_bounded_and_detector_is_live \
            -- --exact --nocapture

      - name: Commit the source edit and remove this one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/one-shot-crypto-quorum.yml
          git add crates/fgdb-crypto/tests/constant_time_audit.rs
          git config user.name "frankengraphdb quorum hardener"
          git config user.email "35050222+Dicklesworthstone@users.noreply.github.com"
          git commit -m "test(crypto): require a 3-of-5 portable timing quorum [fgdb-w1-cross-crate-determinism-ci-flake-ze5e]" \
            -m "Keep the production t/mean-ratio bounds and planted detector thresholds unchanged. Five independent screens now require three passes, tolerating two runner-load episodes without letting one lucky screen certify the implementation. The exact replacement script and focused timing test ran before this commit; this workflow deletes itself in the same change."
          git push origin HEAD:main
