# CI for frankengraphdb — the one gate: scripts/check.sh.
#
# Bead: fgdb-ci-workflow-check-sh-4csa. AGENTS.md: "When CI is added, wire
# scripts/check.sh as the CI test step rather than duplicating the commands."
# The job succeeds if and only if `bash scripts/check.sh` exits 0. Per
# AGENTS.md, the exit code is the verdict — no step here greps for PASS/FAIL
# tokens or interprets transcripts. The separate agent-context workflow is
# advisory and can neither certify nor fail the tree.
#
# Toolchain: the repository-pinned nightly from rust-toolchain.toml is
# installed explicitly and re-derived from that file; a stable channel must
# never be substituted (core::arch / portable_simd kernels require nightly).
#
# Caching note (bead acceptance): caches hold ONLY build artifacts (registry,
# target, rustup toolchains). Every gate — including the file-coverage closure
# and the registry gates — executes on every run regardless of cache state;
# none of them reads target/ or the registry, so cache behavior can never skip
# a check. If a future gate ever consumes cached bytes, this note and the
# cache design must be revisited in the same commit.
#
# Disk strategy (bead fgdb-ci-workflow-check-sh-4csa.1): the chain's build
# graph (full workspace test build + the Miri lanes) exhausted the standard
# runner disk ~29 minutes into compilation — 18 red runs, zero completed
# verdicts, so the enforcement surface this workflow exists to provide never
# actually delivered a verdict. Two honest levers, neither of which touches
# the verdict contract:
#   1. Reclaim the runner image's preinstalled toolcaches before building
#      (step below). This deletes only GitHub's own disposable image content,
#      never repository bytes.
#   2. Strip debuginfo and incremental artifacts from the cargo profiles via
#      env (CARGO_PROFILE_*_DEBUG=0, CARGO_INCREMENTAL=0). This changes
#      artifact size, not semantics; failing-test backtraces lose line
#      detail, and the verdict remains the exit code.
#
# Provisioning: check.sh invokes two external tools the runner image does not
# ship — `lean` (the proof-lanes gate refuses to report green on an unrun
# prover) and `ubs` (the UBS scanner module). Both are installed pinned:
# Lean's version comes solely from formal/lean/lean-toolchain via elan (the
# gate verifies that pin itself), and UBS is fetched at its exact release
# tag, whose module checksums are enforced by the runner script itself.

# MANUAL ONLY, BY OWNER RULING (2026-09-03): "we do not use gh actions for any
# reason, ONLY /dsr". This repository does not take its verdict from GitHub
# Actions and does not release through it; `scripts/local_proof.sh` on the exact
# tree is the verdict, and dsr is the release path.
#
# The automatic triggers are removed rather than the workflow, because the file
# is still the honest record of how check.sh would be run in a hosted lane, and
# `workflow_dispatch` keeps it runnable on request. Leaving push/schedule
# triggers on had a measured cost beyond the noise: this account holds one
# hosted-runner concurrency budget across every repository, and on 2026-09-03 it
# was saturated (93 active or queued runs over the 20 most recently pushed
# repositories; queue waits of 52, 127 and 141 minutes on the last three runs
# that completed here). Every push from this repo took a slot from that shared
# pool and was then cancelled by the next push: 166 of 200 runs, no verdict, and
# other repositories waiting behind them.
on:
  workflow_dispatch:

# Only the current branch head can become the product tree. A superseding
# push cancels the obsolete run explicitly (never green) and starts one proof
# for the new head. This reconciles frequent incremental main commits with the
# rule that only a COMPLETED run's exit code is a verdict: cancellation is an
# honest non-verdict, while an unbounded backlog can prevent the current tree
# from ever receiving a verdict at all. Scheduled and manual runs get a group
# of their own per run id, so they neither cancel nor are cancelled: under a
# 30–60 push/day cadence, per-ref cancellation alone means no run ever
# completes, which is the same as having no gate.
# One group per run id: a manual run is always deliberate, so it neither
# cancels an earlier one nor is cancelled by a later one.
concurrency:
  group: check-${{ github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

# Profile env for every cargo invocation check.sh makes (see the disk
# strategy note above). Caches still hold only build artifacts; no gate
# reads these values, so no gate can be skipped by them.
env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
jobs:
  check:
    name: scripts/check.sh (the whole chain)
    runs-on: ubuntu-latest
    # The chain includes the w1_unsafe_tool_lanes Miri workloads, which are the
    # long pole; leave headroom under the 360-minute runner ceiling.
    timeout-minutes: 350
    steps:
      # Full history: g0_negative_evidence_e2e resolves repair commits against
      # real ancestry and emits false FAILs on shallow clones.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Reclaim the runner image's preinstalled toolcaches (~20 GB on
      # ubuntu-latest). fgdb-ci-workflow-check-sh-4csa.1: without this the
      # build graph ENOSPCs the runner before check.sh can reach a verdict.
      # Disposable image content only — the repository checkout is untouched.
      - name: Reclaim runner disk
        run: |
          set -euo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /usr/share/swift \
            /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache \
            /usr/local/share/boost /usr/lib/jvm /usr/share/apache-maven* \
            /usr/share/gradle-* /usr/share/sbt /usr/local/graalvm \
            /usr/local/aws-cli /opt/microsoft
          sudo docker image prune -af >/dev/null 2>&1 || true
          df -h /

      - name: Install the repo-pinned nightly toolchain
        run: |
          set -euo pipefail
          pin="$(awk -F'"' '/^[[:space:]]*channel[[:space:]]*=/{print $2; exit}' rust-toolchain.toml)"
          test -n "$pin" || { echo "rust-toolchain.toml has no channel pin" >&2; exit 1; }
          echo "Installing pinned toolchain: $pin"
          rustup toolchain install "$pin" --profile minimal --component clippy,rustfmt,miri
          rustup default "$pin"

      # The proof-lanes gate refuses to report green on an unrun prover, and
      # the runner image ships no Lean. elan resolves the toolchain from
      # formal/lean/lean-toolchain at invocation time — the repository file
      # stays the single reader of "which Lean".
      - name: Install Lean via elan (pinned by formal/lean/lean-toolchain)
        run: |
          set -euo pipefail
          curl -sSfL --user-agent "OpenAI File Downloader, XaiImageApiFetch/1.0" \
            https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          # GITHUB_PATH only affects LATER steps — within this step the elan
          # shims must go on PATH explicitly, or the prewarm below dies with
          # 127 before it ever runs lean (run 33290697221).
          export PATH="$HOME/.elan/bin:$PATH"
          # Materialize the pinned toolchain HERE, outside any gate's verdict
          # path: a first `lean` invocation on a fresh runner downloads the
          # toolchain and emits elan `info:` lines, which would otherwise
          # pollute the proof-lanes gate's own `lean --version` pin check
          # (its red in run 33285320157). After this step the gate's probe is
          # a clean, already-materialized version query.
          cd formal/lean && lean --version >/dev/null 2>&1

      # The dependency-policy gate shells out to cargo-deny, which the runner
      # image does not ship (its absence was the gate's exit-2 UNRUN in run
      # 33285320157). Pinned to the version the dev fleet runs.
      - name: Install cargo-deny (pinned v0.19.0)
        run: |
          set -euo pipefail
          cargo install cargo-deny --locked --version 0.19.0
          cargo deny --version

      # tree_stability's landing-lease cases exercise the `br` (beads) CLI.
      # The gate's own doctrine treats a missing tool as UNRUN, never FAIL —
      # but UNRUN still refuses the chain green, so CI must provision it.
      # Pinned to the tag that matches the fleet's binary (0.5.7).
      - name: Install beads CLI (br, pinned v0.5.7)
        run: |
          set -euo pipefail
          cargo install --locked --git https://github.com/Dicklesworthstone/beads_rust --tag v0.5.7 beads_rust
          br --version

      # Two more gate-chain tools the runner image lacks (root-caused from
      # run 33285320157): `rg` — a bare `rg -q` is the threat gate's first
      # unguarded probe and `rg -c` feeds the architecture gate's count
      # assertion; and `cargo-audit` — the dependency-policy gate's
      # command-v guard correctly refuses to run without it. ripgrep comes
      # from the distro (a grep-class scanner; the gates consume its exit
      # code and counts, not its exact output); cargo-audit is pinned.
      - name: Install ripgrep and cargo-audit (pinned v0.22.0)
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ripgrep
          rg --version | head -1
          cargo install cargo-audit --locked --version 0.22.0
          cargo audit --version | head -1

      # The UBS scanner module of the gate chain invokes `ubs`, a bash
      # meta-runner fetched at its exact release tag; module scripts are
      # checksum-verified by the runner itself at run time.
      - name: Install UBS meta-runner (pinned v5.3.13)
        run: |
          set -euo pipefail
          sudo curl -fsSL --user-agent "OpenAI File Downloader, XaiImageApiFetch/1.0" \
            -o /usr/local/bin/ubs \
            "https://raw.githubusercontent.com/Dicklesworthstone/ultimate_bug_scanner/v5.3.13/ubs"
          sudo chmod +x /usr/local/bin/ubs
          ubs --version


      - name: Restore cargo registry cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/bin
            ~/.rustup/toolchains
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            cargo-registry-${{ runner.os }}-

      - name: Restore target directory cache
        uses: actions/cache@v4
        with:
          path: target
          key: target-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            target-${{ runner.os }}-

      # THE gate. Its exit code is the whole verdict.
      - name: bash scripts/check.sh
        run: bash scripts/check.sh

      - name: Summarize the verdict
        if: always()
        run: |
          {
            echo "## scripts/check.sh verdict"
            echo ""
            echo "- exit code: ${{ job.status == 'success' && '0' || 'nonzero' }}"
            echo "- the transcript above is authoritative; per AGENTS.md the"
            echo "  exit code is the verdict and PASS/FAIL tokens exist only so"
            echo "  a reader who greps anyway gets a true answer."
          } >> "$GITHUB_STEP_SUMMARY"
          df -h / >> "$GITHUB_STEP_SUMMARY" 2>&1 || true

      # Preserve the gate transcripts on failure so the next RED is
      # diagnosable in one cycle. The chain writes per-gate transcript +
      # diagnostics under a mktemp'd /tmp dir (random suffix) and the core
      # module logs in $GATE_LOG_DIR; both die with the runner otherwise
      # (beads fgdb-w1-cross-crate-determinism-ci-flake-ze5e and
      # fgdb-write-cost-attribution-runner-flake-n7w4).
      #
      # We stage into a fixed directory first because upload-artifact@v4's glob
      # behavior over absolute /tmp paths has silently produced no artifact in
      # earlier runs (the matching directories were present but the glob did
      # not resolve). `find` copies every matching directory explicitly, then
      # the upload step archives the fixed staging path.
      - name: Stage gate transcripts on failure
        if: failure()
        run: |
          set -euo pipefail
          stage="/tmp/fgdb-gate-transcripts-staging"
          rm -rf "$stage"
          mkdir -p "$stage"
          find /tmp -maxdepth 1 -type d \( \
            -name 'fgdb-check-gates.*' -o \
            -name 'fgdb-det-e2e.*' -o \
            -name 'fgdb-threat-e2e.*' \
          \) -exec cp -a {} "$stage/" \; 2>/dev/null || true
          count="$(find "$stage" -type f 2>/dev/null | wc -l)"
          echo "staged $count transcript/diagnostic files in $stage"
          ls -la "$stage" 2>/dev/null || true

      - name: Upload gate transcripts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fgdb-gate-transcripts
          path: /tmp/fgdb-gate-transcripts-staging
          if-no-files-found: ignore
          retention-days: 7
