name: Drain obsolete proof backlog

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/queue-drain.yml

# This group intentionally matches check.yml exactly. Creating this run cancels
# every obsolete pending/in-flight proof for main. The skipped job needs no
# hosted runner; cancellation is an explicit non-verdict, never a green result.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  drain:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: echo unreachable
