# Fast, advisory context export for connector-only coding agents.
#
# This workflow is deliberately separate from check.yml. It does not certify
# the tree and its status is never a product verdict; scripts/check.sh remains
# the only authoritative gate. The capsule contains no checkout credentials:
# repository history is exported as a Git bundle, not as .git/.
#
# It runs once when this workflow definition changes and can be invoked
# manually thereafter. That keeps the expensive Linux proof chain independent
# while giving agents a reproducible way to materialize oversized tracked
# state such as .beads/issues.jsonl. The utility job uses the macOS hosted pool
# so a long Linux proof run cannot starve this read-only observability path.

name: Agent context capsule

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/agent-context.yml

concurrency:
  group: agent-context-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  capsule:
    name: Build advisory source + bead capsule
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install verified br v0.5.7 binary
        shell: bash
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64)
              asset="beads_rust-0.5.7-darwin_x86_64.tar.gz"
              digest="ffd57e3861555317e50d21ef3ac1142e1c2ca7aa05cc6a956362cf0c87f34847"
              ;;
            arm64)
              asset="beads_rust-0.5.7-darwin_arm64.tar.gz"
              digest="6307d5801671162964728d42e2cef0792fdbfbc112f939db163533ff5dbf069b"
              ;;
            *)
              echo "unsupported macOS runner architecture: $(uname -m)" >&2
              exit 1
              ;;
          esac
          archive="$RUNNER_TEMP/$asset"
          bindir="$RUNNER_TEMP/br-0.5.7"
          curl -fsSL --user-agent "OpenAI File Downloader, XaiImageApiFetch/1.0" \
            -o "$archive" \
            "https://github.com/Dicklesworthstone/beads_rust/releases/download/v0.5.7/$asset"
          printf '%s  %s\n' "$digest" "$archive" | shasum -a 256 -c -
          mkdir -p "$bindir"
          tar -xzf "$archive" -C "$bindir"
          br_path="$(find "$bindir" -type f -name br -print -quit)"
          test -n "$br_path"
          chmod +x "$br_path"
          echo "$(dirname "$br_path")" >> "$GITHUB_PATH"
          "$br_path" --version

      - name: Build capsule
        shell: bash
        run: |
          set -euo pipefail
          stage="$(mktemp -d "$RUNNER_TEMP/fgdb-agent-context.XXXXXX")"
          archive="$RUNNER_TEMP/fgdb-agent-context-${{ github.sha }}.tar.gz"

          {
            echo "format_version=1"
            echo "repository=${{ github.repository }}"
            echo "commit=${{ github.sha }}"
            echo "ref=${{ github.ref }}"
            echo "run_id=${{ github.run_id }}"
            echo "runner_os=${{ runner.os }}"
            echo "runner_arch=$(uname -m)"
            echo "generated_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "authority=advisory-only; git and the live bead database remain canonical"
          } > "$stage/manifest.txt"

          git bundle create "$stage/frankengraphdb.bundle" --all
          git bundle verify "$stage/frankengraphdb.bundle" \
            > "$stage/git-bundle-verify.txt" 2>&1

          cp "$(command -v br)" "$stage/br"
          br --version > "$stage/br-version.txt"
          RUST_LOG=error br ready --json > "$stage/br-ready.json"
          RUST_LOG=error br list --status open --json > "$stage/br-open.json"
          RUST_LOG=error br list --status in_progress --json \
            > "$stage/br-in-progress.json"
          RUST_LOG=error br blocked --json > "$stage/br-blocked.json"
          RUST_LOG=error br stats --json > "$stage/br-stats.json"

          test -f .beads/beads.db
          cp .beads/beads.db "$stage/beads.db"
          cp .beads/issues.jsonl "$stage/issues.jsonl"
          git diff --exit-code -- .beads/issues.jsonl

          git log -100 --date=iso-strict \
            --format='%H%x09%aI%x09%an%x09%s' > "$stage/recent-commits.tsv"
          git status --short --branch > "$stage/git-status.txt"
          git ls-files > "$stage/tracked-files.txt"

          (cd "$stage" && shasum -a 256 * > SHA256SUMS)
          tar -C "$stage" -czf "$archive" .
          echo "capsule=$archive"
          ls -lh "$archive"

      - name: Upload capsule
        uses: actions/upload-artifact@v4
        with:
          name: fgdb-agent-context-${{ github.sha }}
          path: ${{ runner.temp }}/fgdb-agent-context-${{ github.sha }}.tar.gz
          if-no-files-found: error
          retention-days: 2
