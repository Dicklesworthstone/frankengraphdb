# Fast, advisory context export for connector-only coding agents.
#
# This workflow is deliberately separate from check.yml. It does not certify
# the tree and its status is never a product verdict; scripts/check.sh remains
# the only authoritative gate. The capsule contains no checkout credentials:
# repository history is exported as a Git bundle, not as .git/.
#
# A self-change runs this workflow immediately, manual dispatch remains
# available for diagnostics, and completion of the authoritative main-branch
# check produces a capsule for the exact SHA whose verdict completed. The
# utility job uses the macOS hosted pool and the published, checksum-pinned br
# binary, so it cannot compete with the long Linux proof lane for a runner.

name: Agent context capsule

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/agent-context.yml
  workflow_run:
    workflows: [".github/workflows/check.yml"]
    types: [completed]

concurrency:
  group: agent-context-${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  capsule:
    name: Build advisory source + bead capsule
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: macos-latest
    timeout-minutes: 15
    env:
      CAPSULE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      CAPSULE_REF: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref_name }}
      VERDICT_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || 'manual-or-self-test' }}
      VERDICT_CONCLUSION: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion || 'not-applicable' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CAPSULE_SHA }}
          fetch-depth: 0

      - name: Install verified br v0.5.7 binary
        shell: bash
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64)
              asset="br-0.5.7-darwin_amd64.tar.gz"
              digest="292491d803cdca058c21563322b5becb462a87b3e6ea8a3fed2fdc0a97640a9b"
              ;;
            arm64)
              asset="br-0.5.7-darwin_arm64.tar.gz"
              digest="37393209fe778c1907f8d6a799f613ada2f0d34f6dc461d5f67fd0faa3c9a397"
              ;;
            *)
              echo "unsupported macOS runner architecture: $(uname -m)" >&2
              exit 1
              ;;
          esac
          archive="$RUNNER_TEMP/$asset"
          bindir="$RUNNER_TEMP/br-0.5.7"
          curl -fsSL --retry 3 --retry-all-errors \
            --user-agent "OpenAI File Downloader, XaiImageApiFetch/1.0" \
            -o "$archive" \
            "https://github.com/Dicklesworthstone/beads_rust/releases/download/v0.5.7/$asset"
          printf '%s  %s\n' "$digest" "$archive" | shasum -a 256 -c -
          mkdir -p "$bindir"
          tar -xzf "$archive" -C "$bindir"
          br_path="$(find "$bindir" -type f -name br -print -quit)"
          test -n "$br_path"
          chmod +x "$br_path"
          echo "$(dirname "$br_path")" >> "$GITHUB_PATH"
          "$br_path" --version

      - name: Build capsule for the selected SHA
        shell: bash
        run: |
          set -euo pipefail
          stage="$(mktemp -d "$RUNNER_TEMP/fgdb-agent-context.XXXXXX")"
          archive="$RUNNER_TEMP/fgdb-agent-context-$CAPSULE_SHA.tar.gz"

          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$CAPSULE_SHA" || {
            echo "checkout mismatch: expected $CAPSULE_SHA, got $actual_sha" >&2
            exit 1
          }

          {
            echo "format_version=2"
            echo "repository=${{ github.repository }}"
            echo "commit=$CAPSULE_SHA"
            echo "ref=$CAPSULE_REF"
            echo "verdict_run_id=$VERDICT_RUN_ID"
            echo "verdict_conclusion=$VERDICT_CONCLUSION"
            echo "capsule_run_id=${{ github.run_id }}"
            echo "runner_os=${{ runner.os }}"
            echo "runner_arch=$(uname -m)"
            echo "generated_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "authority=advisory-only; the named gate verdict, git, and the live bead database remain canonical"
          } > "$stage/manifest.txt"

          # Give the detached tested SHA one explicit local ref and bundle only
          # that ref. `--all` could silently include a newer origin/main and
          # make the source bundle disagree with the verdict SHA in the manifest.
          git update-ref refs/heads/agent-context-snapshot "$CAPSULE_SHA"
          git bundle create "$stage/frankengraphdb.bundle" \
            refs/heads/agent-context-snapshot
          git bundle verify "$stage/frankengraphdb.bundle" \
            > "$stage/git-bundle-verify.txt" 2>&1

          cp "$(command -v br)" "$stage/br"
          br --version > "$stage/br-version.txt"
          RUST_LOG=error br ready --json > "$stage/br-ready.json"
          RUST_LOG=error br list --status open --json > "$stage/br-open.json"
          RUST_LOG=error br list --status in_progress --json \
            > "$stage/br-in-progress.json"
          RUST_LOG=error br blocked --json > "$stage/br-blocked.json"
          RUST_LOG=error br stats --json > "$stage/br-stats.json"

          test -f .beads/beads.db
          cp .beads/beads.db "$stage/beads.db"
          cp .beads/issues.jsonl "$stage/issues.jsonl"
          git diff --exit-code -- .beads/issues.jsonl

          git log -100 --date=iso-strict \
            --format='%H%x09%aI%x09%an%x09%s' "$CAPSULE_SHA" \
            > "$stage/recent-commits.tsv"
          git status --short --branch > "$stage/git-status.txt"
          git ls-tree -r --name-only "$CAPSULE_SHA" > "$stage/tracked-files.txt"

          (cd "$stage" && shasum -a 256 * > SHA256SUMS)
          tar -C "$stage" -czf "$archive" .
          echo "capsule=$archive"
          ls -lh "$archive"

      - name: Upload capsule
        uses: actions/upload-artifact@v4
        with:
          name: fgdb-agent-context-${{ env.CAPSULE_SHA }}
          path: ${{ runner.temp }}/fgdb-agent-context-${{ env.CAPSULE_SHA }}.tar.gz
          if-no-files-found: error
          retention-days: 2
