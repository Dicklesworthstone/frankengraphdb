# Canonical Protocol-plane field inventory.  Field semantics remain
# authoritative in durable_state_slots.toml; this projection is exact-bijection
# checked and cannot silently alias a SemanticPayload field.
schema_version = 1
registry_epoch = 2
plane = "Protocol"

[[field]]
role = "Local"
slot_tag = "result_delivery_retention"
status = "reserved"

[[field]]
role = "Meta"
slot_tag = "result_independent_retention_index"
status = "reserved"
