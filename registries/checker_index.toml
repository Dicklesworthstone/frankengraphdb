# =============================================================================
# checker_index.toml — resolvable checker/negative-test symbol index (G0)
# =============================================================================
# Bead: fgdb-g0-claim-registries-myx
# Provenance: plan Appendix F preamble ("resolvable enforcement and negative-
# test entrypoints"; "CI verifies ... checker/test symbol existence").
#
# Every `checker_entrypoint` and `negative_test_entrypoint` named by a clause
# in invariants.toml must resolve to a row here. Rows may be stub-registered
# pre-Genesis (status = "stub") so the g0-invariant-spine bead can bind clause
# records before their runtime oracles exist — but the symbol must still be a
# registered, reviewable row.
#
# WHAT `status = "live"` MEANS (fgdb-checker-index-live-is-only-file-existence-tl0o).
# It used to mean `Path::is_file()` — the artifact exists. That is far weaker
# than what AGENTS.md rests on it ("CI cross-checks that every ID has a live
# checker"; "no subsystem ships against an unenforced invariant"): a checker
# could be registered live, be cited by a clause as its enforcement mechanism,
# be invoked by no gate, and contain no code capable of failing, and every
# registry gate stayed green. A live row now has to survive three independent
# reads in `tools/registry-check/src/liveness.rs`:
#
#   REGISTERED  the artifact is a safe repository-relative file AND `unit`
#               resolves inside it;
#   INVOKED     an executing gate can reach it — a cargo-test artifact must be
#               an auto-discovered integration test of a workspace member, a
#               binary artifact must be compiled into a bin target through live
#               `mod` declarations, a script must be an executable program;
#   CAN FAIL    the unit a runner reaches has a path to a failing outcome — a
#               test that can panic, a bin whose `main` can exit nonzero, a
#               script with a nonzero exit. Read from LIVE code only, so a
#               commented-out assertion proves nothing.
#
# Row schema:
#   [[checker]]
#   symbol   = "..."        # the exact symbol clauses cite
#   kind     = "cargo-test" | "script" | "binary" | "stub"
#   artifact = "..."        # repo-relative path implementing the symbol
#   status   = "live" | "stub"
#   unit     = "symbol" | "artifact"    # REQUIRED on a live row
#
# `unit` says what `symbol` names, because nothing else can. Nine live rows name
# a `#[test] fn` (`unit = "symbol"`; deleting or renaming that function now turns
# the row red instead of leaving it green over a file that merely still exists).
# The other twenty-seven are law/gate names for a whole artifact
# (`architecture_source_coverage`, `cargo-test:claims`, `g0_topology_e2e`, ...)
# and say so (`unit = "artifact"`). Those are legitimate — the defect was that
# no spelling rule separated them from a rotted symbol, so both read as a pass.
# =============================================================================

