# --- The gate that guards the tree-stability tripwire (fgdb-mt2b, residue of
# --- fgdb-49ng). 49ng landed the tripwire in scripts/lib/gate_verdict.sh: a gate
# --- whose subject moved underneath it reports UNRUN carrying both shas rather
# --- than a PASS certifying a tree never wholly tested, or a FAIL blaming
# --- whichever pane's code was resident. Nothing guarded the guard. Neuter
# --- gate_check_tree_stable and every gate in this repo stays green — measured,
# --- and now measured by this row: with it neutered this gate reports 7 failures,
# --- and with the trap's `exit` regressed to an `rc=` assignment it reports the
# --- original defect verbatim (token=UNRUN, rc=0 — "did not run" and "success" in
# --- one breath), caught by exactly one case.
# --- Six directions, because a tripwire that only fires is as useless as one that
# --- never does: still+green -> PASS, still+RED -> FAIL with zero UNRUN (the third
# --- state must not swallow a real failure), a landing mid-run -> UNRUN with two
# --- differing shas, an UNCOMMITTED tracked edit -> UNRUN with HEAD equal at both
# --- ends (the case that kills a HEAD-only fingerprint), the EXIT-trap window, and
# --- a mutation control asserting the UNRUNs come from the tripwire itself.
# --- The same artifact also guards fgdb-41p3's aggregate attribution: a
# --- Beads, Rust, shell and gate-driver moves exercise the domain boundaries;
# --- declaration, result-ledger, live-wiring and intersection mutants all red
# --- the panel. Registered artifacts remain explicitly all-tracked until a
# --- narrower reader has its own completeness proof, so an undeclared domain
# --- cannot become a false-PASS escape hatch.
# --- Its subject is a synthetic few-KB git repo, not a clone of this one: it costs
# --- no build slot, cannot race, and never commits in the live worktree — doing
# --- that to prove this would void whatever check.sh is in flight, which is the
# --- harm fgdb-49ng exists to remove.

[[checker]]
symbol = "g0_tree_stability_e2e"
kind = "script"
artifact = "scripts/g0_tree_stability_e2e.sh"
status = "live"
unit = "artifact"

# =============================================================================
# script_disposition — the FILE -> ROW direction (fgdb-orphan-w1-e2e-gates-
# unregistered-unrun-vuq8).
#
# The [[checker]] rows above close row -> file: a "live" row's artifact must
# exist. Nothing closed the other way, so a shell deliverable could sit in
# scripts/ carrying every signal of a gate — set -euo pipefail, pinned counts,
# PASS/FAIL counters — while no runner and no registry knew it existed. Six did.
#
# Every scripts/**/*.sh must now be either a [[checker]] artifact above or a row
# here saying why it is not a gate. `role` is one of runner | advisory |
# candidate | library | hook. Enforced by validate_script_closure, which walks
# the filesystem recursively (not `git ls-files`, since an untracked script is
# already exempt from the shell lint and must not be exempt twice).
# =============================================================================

[[script_disposition]]
path = "scripts/check.sh"
role = "runner"
reason = "the runner itself: it derives and invokes the registered gates, so registering it would make it invoke itself"

[[script_disposition]]
path = "scripts/br_sync.sh"
role = "advisory"
reason = "fgdb-wv3v: the operator entrypoint for an explicit, landing-lease-aware beads export, not a repository checker. Registering this state-mutating helper would make check.sh rewrite tracked .beads/issues.jsonl during its own frozen-input window. Its fail-closed BINDING path, loud fail-open degraded paths, real-br composition, and mutation control are exercised by the registered scripts/g0_tree_stability_e2e.sh gate"

[[script_disposition]]
path = "scripts/bead_provenance_preflight.sh"
role = "advisory"
reason = "pre-commit advisory for .beads/ authors, not part of any gate chain; its own header says 'Run it BEFORE you commit'. The defect that used to be recorded here (exit 0 on the case it exists to catch) is FIXED — fgdb-bead-provenance-preflight-misses-pin-drift-a5kb: its probe now reports validate_architecture's own bead_provenance verdict and red-proves itself on every run. It stays advisory rather than registered on purpose: check.sh already runs architecture-check, which reports the same violations, and a second reader of one fact inside the gate chain is the defect this project keeps closing"

