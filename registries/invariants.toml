exact_statement = '''The concrete durable strong/uncut-conditional graph is acyclic; every field, typed reference, transcript digest, and weak identity is registry-resolved and names already identified bytes, and every pre-order input excludes its future command/result/root. `command_contracts.toml` is bijective with every role command arm/handler and `state_payload_fields.toml` roots every written state class. Before receipt/order, D1 owns one exact closure under stable prepared ownership. W12 read order is begin reservation -> claimed registration/workspace zero -> optional claimed statement -> certified shard bases -> fixed-point routing/authorization/serialization -> buffered result/workspace -> Meta publication/outcome -> external audit batch/visibility advance -> streaming. W12 write order is registration/workspace -> effect bases/routing -> authorization/resource/outcome/admission -> shard fragments/prepares -> constraints/serialization -> final-certification holds and signer-locked terminal bytes -> Meta command/applied-hidden candidate -> external audit batch/visibility advance -> decision publication -> shard decision and typed visibility projection -> post-visibility acknowledgements -> Global delta publication -> TerminalReady. Cross-group ownership uses only certified remote wrappers; timeout releases no prepared, certificate, audit, result, allocation, escrow, or retention owner.'''
