# =============================================================================
# invariants.toml — the invariant registry spine (G0)
# =============================================================================
# Bead: fgdb-g0-claim-registries-myx (schema, spine IDs, activation contract)
# Bead: fgdb-g0-invariant-spine-tmm  (clause payload, materialized below)
# Provenance: plan Appendix F; §1 constraint 11; §19 Gate G0.
#
# This registry contains ONLY exact safety/liveness invariants and their
# formally scoped proof/bounded_model clauses (§1.11). Statistical claims
# live in evidence.toml; slo/benchmark/configuration-model claims live in
# slo.toml. A statistical/slo/benchmark row in this file is a build error.
#
# There are EXACTLY twenty top-level invariant IDs (FG-INV-01 … FG-INV-20).
# Each row is materialized as one or more stable subordinate clause records;
# subordinate clause keys do NOT create additional invariant IDs. The
# twenty-ID table is hash-pinned below; adding a twenty-first ID (or removing
# one) fails CI with the exact row-level diff.
#
# Clause record schema (activation contract, Appendix F preamble):
#
#   [[invariant.clause]]
#   key                      = "FG-INV-04.core"   # stable, ID-scoped
#   claim_class              = "invariant"      # invariant | proof | bounded_model
#   exact_statement          = '''...'''        # Appendix F column 2, VERBATIM
#   enforcement              = '''...'''        # Appendix F column 3, VERBATIM:
#                                               # the apparatus behind the
#                                               # checker entrypoints (optional
#                                               # once entrypoints are live)
#   activation_predicate     = "mvcc-visibility" # boolean expr over capability-
#                                               # manifest features/postures/roles
#   dependencies             = ["FG-INV-03.core"] # clause keys or FG-INV ids
#   checker_entrypoint       = "..."            # must resolve in checker_index.toml
#   negative_test_entrypoint = "..."            # must resolve in checker_index.toml
#   model_or_proof_scope     = "..."            # model scope / bounds / fairness
#   proof_lane               = "lean-..."       # REQUIRED for claim_class = proof;
#                                               # must resolve in proof_lanes.toml
#   owner                    = "fgdb-txn"       # owning crate/subsystem
#   first_gate               = "G1"             # G0 | G1 | G2 | G3 | G4
#   status                   = "stub"           # live | stub | dormant
#   waiver                   = "forbidden"      # literal; anything else fails CI
#   justified_by             = []               # optional; rank(justifier) >=
#                                               # rank(clause) or the build fails
#
# ACTIVATION DISCIPLINE (pre-Genesis): every clause below is status = "stub"
# and guarded by the capability atom of its owning feature. No capability
# manifest may enable an atom until the clause's checker is live — CI computes
# the closure and forces the capability off otherwise ("every reachable clause
# must be live; an unimplemented or dormant clause forces its feature off and
# cannot count as covered"). Workstream beads flip status stub -> live in the
# same change that lands the checker, never before.
#
# THE PROMOTION LAW IS NOW ENFORCED
# (fgdb-clause-promotion-to-live-is-unguarded-nllh).
# The sentence above was prose and no code. Measured: promoting a clause here to
# `live` and changing nothing else produced ZERO violations — its checker stayed
# a `status = "stub"` row pointing into a crate that does not exist. So did the
# degenerate case, a clause whose negative_test_entrypoint IS its
# checker_entrypoint. The entire law for both fields was "the string resolves to
# a row", and 18 of the 20 clauses below carry first_gate = "G1", so at G1
# roughly eighteen invariants promote in one window with nothing but reviewer
# attention between "enforced" and "a row exists".
#
# An ENFORCED clause (see `CLAUSE_STATUS_ENFORCED` in validate.rs — one list
# decides both the accepted vocabulary and which statuses enforce) now requires:
#
#   * `checker_entrypoint` resolves to a checker_index row that is
#     `status = "live"` AND live in the full sense `liveness.rs` defines
#     (registered + invoked + capable of failing). That question is DELEGATED to
#     the same reader that answers it for checker_index.toml and
#     proof_lanes.toml, not answered a third time;
#   * `negative_test_entrypoint` meets the SAME bar, not a weaker one. Its whole
#     purpose is to prove the checker can go red, so a negative test that cannot
#     itself fail proves nothing;
#   * the two are DISTINCT SYMBOLS. They may share an ARTIFACT — all twenty
#     clauses below do, and tests/claims.rs holds both a checker and a negative
#     test — but one symbol cannot be both the proof and the proof that the
#     proof can fail.
#
# `dormant` does not enforce, by the same header sentence that defines it: a
# dormant clause forces its feature off and cannot count as covered.
#
# CI (tools/registry-check) verifies: the twenty-ID set and table hash, the
# clause dependency DAG (acyclic, registered targets only), checker/negative-
# test symbol existence, waiver = "forbidden" on every clause, proof-lane
# resolution, class-lattice legality of justified_by, and the compiled-plus-
# negotiated activation closure.
# =============================================================================

schema_version = 1

[registry]
name = "invariants"
allowed_claim_classes = ["invariant", "proof", "bounded_model"]
waiver_policy = "forbidden"
twenty_id_hash = "fnv1a64:204a4b17c8ecc57f"

# THE ENFORCEMENT LEDGER (fgdb-fginv-spine-zero-live-checkers-v05b).
#
# AGENTS.md: "CI cross-checks that every ID has a live checker", and under it the
# hard rule "no subsystem ships against an unenforced invariant". Every clause
# below WAS stub and every entrypoint resolved to a stub checker_index row, so
# that cross-check quantified over an EMPTY SET and passed — an exit code
# indistinguishable from a fully enforced spine.
#
# THE SET IS NO LONGER EMPTY. Six clauses are live across five invariant ids —
# `FG-INV-04.pinned-snapshot-visibility`, `FG-INV-05.first-committer-wins`,
# `FG-INV-09.four-layer-identity-recomputation`,
# `FG-INV-12.canonical-scalar-coherence`, `FG-INV-12.hash-coherence` and
# `FG-INV-19.replay-grade-monotonicity` (beads fgdb-1sto, fgdb-j6aq,
# fgdb-owrc). Each binds a property of its invariant whose apparatus already
# runs on every `cargo test`: the canonical-scalar law suite in `fgdb-types`,
# the identity pipeline in `fgdb-chronicle`, the first-committer-wins witness
# and the pinned-snapshot read on the embedded `fgdb` product paths, and the
# replay grader in `fgdb-sim`.
#
# EVERY ONE OF THEM IS A NARROWING, and each carries a comment above its row
# saying so and naming what stays with its `.core`. That is not politeness. A
# live clause is counted by the ledger below as enforcement, so a statement
# that reaches past its apparatus converts a stub into a false claim — which is
# exactly what happened once here and was caught by an independent verifier:
# `FG-INV-12.canonical-scalar-coherence` shipped claiming "equality, hashing,
# ordering, and encoding" while binding nothing that touched a hash. Write the
# statement to the apparatus, not to the Appendix F sentence.
#
# Every `.core` clause is still stub, and an ID counts as enforced only when
# EVERY clause under it does, so `expected_enforced_invariants` stays 0 while
# six clauses are enforced. That asymmetry is the honest shape: the law now
# quantifies over something real without claiming any subsystem is verified.
#
# These two numbers are what make the zero mean "deliberately zero" instead of
# "nothing was examined", in the same shape sample_capability_manifest.toml's
# `expected_reachable_clauses` already uses. registry-check recomputes both by
# asking liveness.rs whether each clause's apparatus is live, and fails when
# either differs in EITHER direction: too few means a clause silently regressed
# to stub, too many means one was promoted without the gate review the doctrine
# requires. It also fails if the ledger accounted for fewer than the twenty ids,
# or if the spine holds no clauses at all — a law cannot pass by having nothing
# to check.
#
# A clause counts as enforced only when its status enforces AND both its
# entrypoints are live checker rows in the full liveness.rs sense. An ID counts
# only when every clause under it does. Raising either number is a G-gate event:
# land the checker, then bump the declaration in the same change.
# WHAT THESE TWO NUMBERS DO NOT CATCH, measured 2026-09-04 (bead fgdb-owrc,
# reproduced independently after a verifier found it). They check the
# declaration against the tree, so a change that moves BOTH — demoting a live
# clause to stub AND lowering the count in the same edit — is self-consistent
# and passes `registry-check all` with zero violations. That is a silent
# regression of enforcement under a green verdict.
#
# Nothing in this registry can catch it, and that is structural rather than a
# defect to fix here: the registry knows what the tree says, not what it OUGHT
# to say. The expectation lives in the one place that can hold it, as an exact
# key set — `claims_enforcement_ledger_control` in
# `tools/registry-check/tests/claims.rs`, which asserts the measured enforced
# clauses BY KEY. Confirmed by mutation: with the demotion above applied, that
# test fails naming the missing key while every registry law stays silent.
# Never weaken that assertion back to a count; it is the only guard against
# this class.
expected_enforced_clauses = 6
expected_enforced_invariants = 0

# The CLOSED vocabulary of capability atoms an activation_predicate or a
# capability manifest may name (bead fgdb-regcheck-closure-vacuous-no-control-hp0f).
#
# Why this list has to exist. An atom that is misspelled evaluates false in
# exactly the same way as an atom whose capability has not landed yet, so
# `mvcc-visibilty` in a predicate makes its clause unreachable FOREVER, silently
# escaping enforcement under a green verdict, and no gate could ever say so —
# including after Genesis. Measured before this list existed: misspelling one
# atom shrank the reachable set from 20 to 19 with no violation of any kind.
# With the vocabulary closed, registry-check rejects the typo instead.
#
# Adding a capability means adding its atom here first. That is deliberate: the
# vocabulary is a positive claim about what capabilities this system HAS, and it
# is checked in both directions against the twenty-ID spine.
capability_atoms = [
    "authorization",
    "base-semantics",
    "branching",
    "canonical-scalars",
    "commit-stream",
    "content-addressing",
    "durable-formats",
    "exclusive-ownership",
    "garbage-collection",
    "id-allocation",
    "incremental-derivatives",
    "merge-ladder",
    "mvcc-storage",
    "mvcc-visibility",
    "obligation-tracking",
    "replay-manifests",
    "root-publication",
    "serializable-isolation",
    "ssi-witnesses",
    "txn-lifecycle",
]

# -----------------------------------------------------------------------------
# FG-INV-01
# -----------------------------------------------------------------------------

[[invariant]]
id = "FG-INV-01"
title = "Attempt/outcome uniqueness: at most one immutable semantic terminal outcome and final-effect digest per registered attempt; AttemptFamilyState admission discipline"

[[invariant.clause]]
key = "FG-INV-01.core"
claim_class = "invariant"
exact_statement = '''Within one database security namespace/incarnation and capability domain, each scoped begin/autocommit key, durable token, and registered attempt maps to at most one immutable semantic terminal outcome and final-effect digest; matching retries return the recorded lineage and conflicting transitions fail. Commit has exactly one marker, while Abort, NeverRegistered, and ReadClosed can never later Commit. W12 reserves the begin key and outcome-capability bytes before response. `AttemptFamilyState` admits only generation-zero `First`, exact `prior+1 Successor` after a prior **registered** attempt is Terminal and its release/overlap floor is proved, or byte-identical `IdempotentRetry`; NeverRegistered creates no family/generation/burn. At most one generation is Active or PrepareAdmitted. TerminalReady is exposed only after its exact postcondition bitmap, audit visibility, and independent result detachment are complete; detailed and compacted proofs return byte-identical public outcomes, and no shard creates or reverses the semantic decision.'''
enforcement = '''Local/Meta begin, family, token, attempt, marker, ownership, outcome, and completion CAS models; lost-response and concurrent first/successor/retry/cancel/read-close/commit tests; NeverRegistered-no-family negatives; participant, leader-loss, crash, partition, compaction, and capability-status oracles.'''
activation_predicate = "txn-lifecycle"
dependencies = []
checker_entrypoint = "fg_inv_01_core_checker"
negative_test_entrypoint = "fg_inv_01_core_negative"
model_or_proof_scope = "Runtime CAS-model oracles and concurrency test campaigns per the enforcement column; no formal lane bound to this clause."
owner = "fgdb-txn"
first_gate = "G1"
status = "stub"
waiver = "forbidden"

# -----------------------------------------------------------------------------
# FG-INV-02
# -----------------------------------------------------------------------------

[[invariant]]
id = "FG-INV-02"
title = "Exclusive-ownership generations: single legal live owner per exclusive unit; escrow custody partition and conservation"

[[invariant.clause]]
key = "FG-INV-02.core"
claim_class = "invariant"
exact_statement = '''For every exclusive block, constraint-owner reservation, resource hold, allocation offset, final-certification basis, and escrow custody unit, at most one legal live generation owns or may consume it; stale, cancelled, expired, or prior-configuration owners can neither mutate nor release it. Under §14.6's batch-certification law the batch-scoped `GlobalFinalCertificationReservation` is the single legal live owner of a shared certification basis and carries per-candidate sub-holds; exclusivity is per generation, not per candidate, and no candidate-level owner may coexist with a live batch owner. Escrow custody is a disjoint exhaustive partition, finite-side conservation equations hold at every transition, values remain within bounds, and only registered creation/reconfiguration/quota-epoch/branch-overlay-retirement transitions with exact before/after proof may mint or burn rights.'''
enforcement = '''Lock/reservation/ownership-transfer models; Lean escrow conservation/bounds lane; independent lock-table, generation reuse, duplicate consume, cancellation, reconfiguration, quota rollover, crash, and topology-transfer oracles.'''
activation_predicate = "exclusive-ownership"
dependencies = []
checker_entrypoint = "fg_inv_02_core_checker"
negative_test_entrypoint = "fg_inv_02_core_negative"
model_or_proof_scope = "Ownership/reservation models and runtime oracles; escrow conservation and bounds are additionally Lean-scoped via the cited lane."
proof_lane = "lean-escrow-conservation"
owner = "fgdb-txn"
first_gate = "G1"
status = "stub"
waiver = "forbidden"

