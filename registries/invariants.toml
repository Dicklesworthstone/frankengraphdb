# -----------------------------------------------------------------------------
# FG-INV-04
# -----------------------------------------------------------------------------

[[invariant]]
id = "FG-INV-04"
title = "Visibility law: snapshot high sequence, branch ancestry, valid-time slices, audit-visibility pipeline, erasure/expiry conjuncts; no applied-hidden observation"

[[invariant.clause]]
key = "FG-INV-04.core"
claim_class = "invariant"
exact_statement = '''Visibility obeys system-time snapshot high sequence, selected branch ancestry for each graph-reference role, valid-time slice-set intersection and boundary normalization, create/retire and schema-coordinate rules, own-write/workspace overlays, the erasure-tombstone conjunct (§12.6), and the expiry predicate (§4.8); distinct branch heads or valid-time selectors never alias. Local/Meta applied state may advance ahead of public state only through the rooted gap-free audit visibility pipeline, and every read/result/side channel begins at its visible endpoint; a `SnapshotQuery` admission reads only the pipeline's visible candidate root and can never observe applied-hidden state. Restore/role-transition state remains unobservable while reconciliation, activation, pipeline release, service preparation, or independent reopen is pending; every request, cursor, capability, and forwarded shard operation matches the current incarnation/service epoch.'''
enforcement = '''Reference engine plus Lean visibility/slice model; boundary-time, historical-self-join, workspace, branch-head, applied-versus-visible, hidden-restore/direct-endpoint, stale-epoch, erased-subject/expired-element visibility, `SnapshotQuery` visible-endpoint, and Local/Meta/Shard noninterference oracles.'''
activation_predicate = "mvcc-visibility"
dependencies = ["FG-INV-03.core", "FG-INV-08.core"]
checker_entrypoint = "fg_inv_04_core_checker"
negative_test_entrypoint = "fg_inv_04_core_negative"
model_or_proof_scope = "Visibility/slice semantics are Lean-scoped via the cited lane and differentially checked against the reference engine; pipeline and epoch conjuncts are runtime-oracle scoped."
proof_lane = "lean-mvcc-visibility"
owner = "fgdb-txn"
first_gate = "G1"
status = "stub"
waiver = "forbidden"

# A NARROWING of FG-INV-04, not a quote (bead fgdb-owrc). The Appendix F
# statement also covers branch ancestry per graph-reference role, valid-time
# slice-set intersection and boundary normalization, create/retire and
# schema-coordinate rules, workspace overlays, the erasure-tombstone conjunct
# (§12.6), the expiry predicate (§4.8), and the non-aliasing of distinct branch
# heads or valid-time selectors. None of that is bound here. What is bound is
# the system-time half, in both directions: a pinned read must not widen when a
# later commit lands, and must not narrow below the live answer at the live
# frontier. `.core` keeps the whole statement.
[[invariant.clause]]
key = "FG-INV-04.pinned-snapshot-visibility"
claim_class = "invariant"
exact_statement = '''A read pinned at a system-time sequence sees exactly the effects at or below it: a commit after the captured frontier widens the live answer and leaves the pinned answer unmoved, and a pinned read at the live frontier equals the live read.'''
enforcement = '''Product read-path witness on the embedded `Database` under the lab runtime: the pinned call is made from the same handle before and after the live scan, so an answer cached from the live scan cannot fake it; the live-frontier equality is the paired control against a pinning path that passes by hiding legitimate effects.'''
activation_predicate = "mvcc-visibility"
dependencies = []
checker_entrypoint = "the_pinned_seq_answer_is_unmoved_by_later_commits"
negative_test_entrypoint = "execute_gql_at_live_frontier_equals_execute_gql"
model_or_proof_scope = "System-time snapshot visibility on the embedded GQL read path. NOT branch ancestry, valid-time slice sets, create/retire or schema-coordinate rules, workspace overlays, erasure tombstones, or the expiry predicate: those are the rest of FG-INV-04 and stay with .core."
owner = "fgdb"
first_gate = "G1"
status = "live"
waiver = "forbidden"

# -----------------------------------------------------------------------------
# FG-INV-05
# -----------------------------------------------------------------------------

[[invariant]]
id = "FG-INV-05"
title = "Serializability: acyclic dependency graphs; Local default strict serializable via DSG-union-real-time checking"

[[invariant.clause]]
key = "FG-INV-05.core"
claim_class = "invariant"
exact_statement = '''Every committed SERIALIZABLE history has an acyclic logical dependency graph, and dependency metadata remains until no overlapping attempt can add an edge. For the Local SERIALIZABLE default the checked graph additionally contains real-time precedence edges — or applies the registered dangerous-structure rule proved to reject every DSG-union-real-time cycle — so the default Local contract is strict serializable; W12 Meta histories remain plain serializable unless Meta registers the same certification rule. W12 Meta state contains every local, cross-shard, read-only, statement-workspace, positive/negative/gap/path `wr`, `ww`, and `rw` edge. Each statement publication atomically extends the cumulative witness/conflict state; ReadWrite admission and ReadOnly close name the exact statement/delivery/workspace frontier and independently recheck the complete graph; compaction removes detail only after overlap closure.'''
enforcement = '''Independent local/global SCC and history oracle, checking DSG-union-real-time acyclicity for Local histories; statement-publication/admission/read-close/compaction interleavings; overlap-lifetime model and scoped Lean theorem.'''
activation_predicate = "serializable-isolation"
dependencies = ["FG-INV-06.core"]
checker_entrypoint = "fg_inv_05_core_checker"
negative_test_entrypoint = "fg_inv_05_core_negative"
model_or_proof_scope = "Block-level SSI safety is Lean-scoped via the cited lane; history acyclicity is independently oracle-checked (the database's own cycle detection verifies its own serialization graphs)."
proof_lane = "lean-block-ssi-safety"
owner = "fgdb-txn"
first_gate = "G1"
status = "stub"
waiver = "forbidden"

# A NARROWING of FG-INV-05, not a quote (bead fgdb-j6aq). The Appendix F
# statement is full serializability: an acyclic dependency graph with
# real-time precedence edges and registered dangerous-structure detection.
# First-committer-wins is a conservative write-write mechanism, not that
# graph — it can reject histories serializability would admit, and it says
# nothing about read-write anomalies. What it does establish, and what Gate
# G1's Genesis slice actually asks for, is that commit validation is not a
# pass-through. `.core` keeps the whole statement.
[[invariant.clause]]
key = "FG-INV-05.first-committer-wins"
claim_class = "invariant"
exact_statement = '''Two write batches prepared against one snapshot cannot both commit when their write sets overlap: the first committer wins and the second receives a typed abort attributable to the first-committer-wins law, leaving nothing of the loser durable.'''
enforcement = '''Product write-path witness on the embedded `Database`: two `WriteBatch`es prepared against one snapshot and overlapping on a vertex, where the loser's abort must name `FG-LAW-FCW-01` rather than any fold arm (`AlreadyLive`, `IdentitySpent`, `UnknownVertex`, `UnknownEdge`, `DanglingEndpoint`) or the generic commit wrap. Disjoint write sets and sequential advanced-basis writes are held alongside as false-abort controls.'''
activation_predicate = "serializable-isolation"
dependencies = []
checker_entrypoint = "overlapping_prepared_batches_abort_the_second_committer"
negative_test_entrypoint = "overlapping_abort_is_attributable_to_fcw_not_the_fold"
model_or_proof_scope = "The embedded product write path under the lab runtime. NOT the dependency-graph law: no DSG is built, no real-time precedence edge is checked, and read-write anomalies are out of scope. Those stay with .core."
owner = "fgdb"
first_gate = "G1"
status = "live"
waiver = "forbidden"

