exact_statement = '''Authorization precedes every observation or effect across storage, statistics, routing/scoring, temporal selection, workspace, errors, constraints/witnesses/prepares, derived state, Prism/UDFs, streams, capabilities, replay/export/backup, audit, and observability. `SnapshotQuery` admission obeys the identical authorization-before-observation rule — coordinator-local admission verifies the complete capability and policy binding before any statement or storage observation — with the same oracle coverage as the durable read classes. Every authority-bearing durable schema binds one complete `SecurityStateBinding` (or exact certified shard projection); equal epoch scalars with different roots/service epochs never substitute. W12 registration claims operation/statement tickets before observation; shard work carries only exact certified projections. One union-wide authorization decision covers the complete effect set. A protected candidate becomes observable only after its signer-locked terminal event, external resolution batch, and gap-free visibility advance; shard acknowledgements and streaming follow that visibility. Capability lookup/status/release is same-principal, same-or-narrower, current-epoch, and uniformly nonrevealing on failure. Hidden constraints follow one explicit disclosure contract and only named ticketed declassification is legal.'''
enforcement = '''Generated authority-binding and pre-observation type matrices; raw-cross-group/equal-scalar-different-root/wrong-domain/config/grant/owner negatives; ticket claim, omitted participant, status/release noninterference, pre-visibility observation/ack, `SnapshotQuery` admission-before-observation, declassification, and continuity tests.'''
