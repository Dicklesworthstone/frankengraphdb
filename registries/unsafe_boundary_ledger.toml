row_id = "vfs-mapping-munmap"
island = "fgdb-unsafe-vfs"
path = "crates/fgdb-unsafe-vfs/src/view.rs"
symbol = "fn drop(&mut self) {"
stated_invariant = "`addr` and `map_len` are exactly the address and length `mmap` returned and are never modified after construction, so this unmaps precisely what was mapped and nothing else — in particular it cannot unmap a neighbouring mapping, which is the failure mode a recomputed length would produce. `Drop` runs at most once per `Mapping`, and `Mapping` is neither `Copy` nor `Clone` and is never moved out of, so the range cannot be unmapped twice. Every slice handed out by `view_bytes` borrows `&self` and is therefore dead before this point. The syscall follows the same declared x86-64 Linux ABI as the mapping site: number in rax, arguments in rdi and rsi, rcx and r11 clobbered, `nostack` licensed and `preserves_flags` not claimed. The result is checked with `debug_assert!` rather than propagated because `Drop` cannot return a value, and a failing `munmap` on an address the kernel gave us is a defect in this crate rather than a runtime condition a caller could handle."
evidence = "crates/fgdb-unsafe-vfs/tests/map_path_differential.rs::views_are_independent_and_survive_each_others_drops — four overlapping and non-overlapping views held live at once and dropped in an order deliberately unlike the order they were made, with every surviving view re-read and compared against the file after each drop. A `Drop` that unmapped the wrong range, unmapped a length it recomputed, or unmapped twice shows up there as garbage or a fault rather than as a clean run."
fallback = "The buffered backing's `Vec`, whose reclamation is the compiler's job and cannot unmap the wrong range. The drop path is exercised on both backings by the same test, so the ledgered path is compared against a reclamation whose correctness is not in question."
no_claim_boundary = "Says nothing about `munmap` failing at runtime: the `debug_assert!` fires in test and debug builds only, so a release build would ignore an error the kernel should never produce for an address it returned. Says nothing about the memory being zeroed or returned to the OS on any particular schedule. Says nothing about signal-safety or about unwinding through the drop. Miri is excluded because it does not execute the inline-assembly syscall path; ASAN and TSAN are explicit native-instrumentation candidates rather than exclusions, and neither has a checked workload today."
