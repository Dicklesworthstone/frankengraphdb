# Direct dependencies forbidden to every fgdb-* crate regardless of layer.
# `pyo3` is FG-CON-01's packaging boundary: fgdb-python may consume fnx-python
# and therefore its already-pinned transitive binding runtime, but no fgdb-*
# crate may name PyO3 directly — including fgdb-python itself.
[[forbidden_dependency]]
id = "no-linked-frankensqlite"
selector = "all_crates"
package_prefix = "fsqlite-"
plan_anchor = "§1 constraint 1, §2.3"
reason = "frankensqlite is the architectural donor, not a dependency: graph objects are not SQLite pages. Designs are adopted; packages are never linked."

[[forbidden_dependency]]
id = "no-direct-pyo3"
selector = "all_crates"
package_prefix = "pyo3"
plan_anchor = "§1 constraint 1"
reason = "The engine, server, CLI, and durable formats stay free of the Python packaging boundary. fgdb-python reaches the binding runtime transitively through fnx-python only."

[[forbidden_dependency]]
id = "no-tooling-in-engine"
selector = "all_crates"
package_prefix = "registry-check"
plan_anchor = "§18.1 (tooling is not an engine crate)"
reason = "G0 constitutional tooling validates the registries; an engine crate depending on the validator would invert the gate."

# =============================================================================
# THE CRATE MAP
# =============================================================================
# `role_basis`:
#   plan_parenthetical — `role` is verbatim from the §18.1 table and is checked
#                        against the parsed block
#   layer_charter      — descriptive prose derived from the layer charter; NOT a
#                        plan quotation and not checked as one
#
# `posture_basis`:
#   product_shape       — §1 constraint 5: one codebase, three postures; engine
#                         crates participate in all three
