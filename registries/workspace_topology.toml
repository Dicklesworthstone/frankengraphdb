# A consume_from row whose capability the §2.1/§2.2 asset tables do not
# enumerate. The default is strict — every consumed capability names exactly one
# asset row — so an exception is a registered row, and the checker VERIFIES THE
# ABSENCE: marking a row here while its asset row exists is itself a violation,
# which is what stops this from becoming an escape hatch.
#
# MEASUREMENT (2026-07-26, this bead). §18.2 attributes "Kafka/JetStream
# clients" to asupersync, and the capability is really there — `src/messaging/`
# plus the optional `kafka` feature (`kafka = ["dep:rdkafka"]`, default-off) in
# the pinned revision. What is missing is the §2.1 ASSET ROW: the table that
# supplies our exact per-capability evidence never enumerates messaging clients.
# So this is a plan documentation gap, not a capability we are inventing and not
# a subsystem we should be building. Reported rather than papered over; adding
# the §2.1 row is a plan edit this bead does not own.
[[asset_evidence_gap]]
capability_id = "queue-clients"
verified_absent_from = "plan-asupersync-assets-v1"
reason = "§18.2 names the capability; the §2.1 asset table has no messaging row. Verified present in the pinned foundation at src/messaging/ behind the default-off `kafka` feature — which is exactly what asupersync's mandatory default-features = false keeps out of our closure."

