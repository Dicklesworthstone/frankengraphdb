# =============================================================================
# LAYERS
# =============================================================================
# `source_order` is the §18.1 table position, checked against the parsed table.
#
# `allowed_outgoing_layers` is DERIVED, and the checker recomputes it:
#
#     allowed(L) = { M : M.source_order <= L.source_order } ∪ { unsafe_islands }
#
# The union term is the one exception to table order in this registry, and it is
# registered rather than silent. The islands are leaf infrastructure (SIMD
# kernels, arenas, VFS surfaces) consumed by every layer INCLUDING foundation
# codec/crypto/collections kernels, while themselves consuming only foundation
# types. That makes exactly one reciprocal LAYER pair — foundation <->
# unsafe_islands, declared below — and no reciprocal CRATE pair: crate-level
# acyclicity is checked unconditionally over the live graph, so the exception
# buys a legal edge without buying a cycle.
# -----------------------------------------------------------------------------

[layer_law]
reciprocal_pair = ["foundation", "unsafe_islands"]
reciprocal_reason = "The unsafe islands are leaf infrastructure: foundation codec/crypto/collections kernels consume them (per fgdb-w1-unsafe-ledger-icp's own consumer list), and they consume foundation types. Crate-level acyclicity is enforced separately and unconditionally."
crate_graph_must_be_acyclic = true

[[layer]]
id = "foundation"
title = "Foundation"
source_order = 1
allowed_outgoing_layers = ["foundation", "unsafe_islands"]
charter = "Canonical value/type/claim/policy/resource vocabulary, in-house codecs, sketches, collections, crypto, calibration, and evidence envelopes. No I/O, no durable state machines."

[[layer]]
id = "unsafe_islands"
