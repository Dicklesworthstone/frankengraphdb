# =============================================================================
# NAMED CRATE-LEVEL EDGES
# =============================================================================
# The plan fixes layer direction plus these named edges. Endpoint kinds:
#   crate      — one registered crate
#   layer      — any crate in that layer satisfies the obligation
#   foundation — a registered foundation project (prefix match)
#
# Each row is checked the moment both endpoints have an active crate and is
# reported as `deferred` — never as `pass` — until then. A row that can never
# fire is worse than no row, so the checker emits the live/deferred split and
# the suite asserts the split is what this registry says it is.
