# =============================================================================
# FOUNDATION PROJECTS — the entire legal external universe
# =============================================================================
# `linkage`:
#   linked      — at least one active crate depends on it today
#   linkable    — legal to depend on, nothing does yet
#   design_only — designs may be adopted; the packages may NEVER be linked
#
# `package_prefixes` is normative and matches FG-CON-01's own wording ("the
# `fnx-*` crates of `franken_networkx`") rather than an enumeration that would
# rot every time a foundation adds a crate. `known_members` is documentation.
#
# `pinned_rev` is the single workspace-wide revision: two revisions of one
# foundation is two versions of one capability, which is the duplicate-subsystem
# failure wearing a git hash.
# -----------------------------------------------------------------------------

