# =============================================================================
# workspace_topology.toml — the frozen workspace crate/layer topology (G0)
# =============================================================================
# Bead: fgdb-g0-workspace-topology-1q9m
# Provenance: plan §18.1 (crate/layer table), §18.2 (build-it-ourselves
# inventory), §1 constraints 1-2 (FG-CON-01/FG-CON-02), §2.1/§2.2/§2.3 (the
# foundation asset tables), §15.2 (the fgdb-reference dependency allowlist),
# §19 G0 (materialization), §19 workstream table (ownership).
#
# WHY THIS REGISTRY EXISTS. The closed dependency universe and the layer
# direction are safety properties, not conventions. Without one executable map,
# later work can add an external crate, invert Chronicle/Strata/Loom ownership,
# duplicate an asupersync or fnx subsystem, link `fsqlite-*`, or relax the
# unsafe policy — each of which reads exactly like ordinary progress in a diff.
# This registry is the map; docs/WORKSPACE_TOPOLOGY.md is its published
# rendering; `topology-check` is the gate.
#
# THIS IS A CONTRACT, NOT PERMISSION TO CREATE CRATES. A crate row is frozen
# vocabulary. `activation_status = "active"` means the crate exists in the
# workspace *with its first real final-abstraction slice*; "planned" means the
# row is frozen and the directory MUST NOT exist yet. The registry therefore
# forbids the empty prototype crate mechanically, in both directions.
#
# THE FIVE LAWS THIS REGISTRY ENFORCES THAT NOTHING ELSE DOES.
#
#   1. Crate-universe derivation. The crate set, its per-layer partition, and
#      the order within each layer are DERIVED from the §18.1 table by parsing
#      it, not transcribed. Every backticked `fgdb…` token in the table must be
#      a registered crate, every registered crate must appear in its own
#      layer's row, and the in-row order must match `layer_position` exactly.
#      A crate the plan names and this registry forgot is a violation, which is
#      the failure an eyeballed transcription cannot catch.
#   2. Activation bijection against the live tree. Every Cargo workspace member
#      resolves to an active crate row or a registered tooling member, and every
#      active row resolves to a real manifest + crate root. A "planned" row with
#      a directory, or a directory with no row, is a violation.
#   3. Closed-universe resolution. Every dependency of every active crate
#      resolves to a registered crate, or to a registered foundation project at
#      its single pinned revision with default features disabled. There is no
#      allow-list of externals to forget to update: anything unresolvable is a
#      violation, `fsqlite-*` is a registered forbidden prefix, and `pyo3` is
#      forbidden as a DIRECT dependency of every `fgdb-*` crate (FG-CON-01's
#      packaging boundary), including `fgdb-python`.
#   4. Inventory partition and coverage. Every capability in §18.2 is exactly
#      one of build_here / consume_from / design_only. Coverage is proved by
#      residue: each row's phrase is deleted from the frozen §18.2 source line,
#      and what remains must be punctuation and registered rationale
#      allowances. A capability the plan lists and this registry dropped leaves
#      a residue token and fails, so "duplicate a foundation subsystem" cannot
#      pass by omission.
#   5. Unsafe-policy exactness. Exactly the three named `fgdb-unsafe-*` islands
#      may carry `deny_ledgered`; every other crate carries `forbid`, the
#      workspace default is `forbid`, and every ACTIVE forbid-crate root is
#      scanned for the attribute and for `unsafe` usage.
#
# WHAT THIS REGISTRY DELIBERATELY DOES NOT DO.
#
#   * It does not own the unsafe-boundary LEDGER. Site-level rows (path,
#     invariant, evidence, fallback, no-claim boundary) and the site<->row
#     bijection belong to fgdb-w1-unsafe-ledger-icp, which also creates the
#     islands. This registry owns the per-crate POLICY column only, and the
#     three island rows sit at activation_status = "planned" until that bead
#     lands them. Enforcing a bijection against a ledger that does not exist
#     would manufacture a G0 fact from a W1 deliverable.
#   * It does not invent the per-crate dependency graph. The plan fixes LAYER
#     direction plus a handful of named crate-level edges; those named edges are
#     `[[required_dependency]]` rows, checked the moment both endpoints are
#     active and reported as `deferred` (never as `pass`) until then. Inventing
#     the other ~200 edges would freeze guesses as contract.
#   * It does not bind posture closures for crates that do not exist. The
#     posture law runs over the LIVE dependency graph; with no composition crate
#     active it reports `deferred` for all three postures. The closure evaluator
#     itself is proved against synthetic fixtures in the suite, so the law is
#     known to fire rather than assumed to.
# =============================================================================

schema_version = 1

[registry]
name = "workspace_topology"
document_path = "docs/WORKSPACE_TOPOLOGY.md"
replay_command = "cargo run -p registry-check --bin topology-check -- --root ."
bound_constraints = ["FG-CON-01", "FG-CON-02"]
# Workspace members that are deliberately NOT engine crates. G0 constitutional
# tooling validates the registries and is std-only by the same constraint it
# enforces; it is not part of any posture closure.
tooling_members = ["tools/registry-check"]
# The unsafe-boundary ledger (fgdb-w1-unsafe-ledger-icp) declares the same three
# islands this registry does, with its own status column. Two registries that
# both name the islands must not be able to disagree, so the path is declared
# here and the island roster is checked as a bijection in both directions.
# Site-level rows and the site<->allow bijection stay theirs; the crate-level
# policy column stays ours.
unsafe_ledger_registry = "registries/unsafe_boundary_ledger.toml"
workspace_manifest = "Cargo.toml"
workspace_unsafe_lint = "forbid"
toolchain_channel = "nightly-2026-08-31"
# Blocks the generated document embeds VERBATIM between markers. The other
# blocks are pinned and hash-checked but not reproduced: a document that quotes
# a quarter of the plan is a document nobody reads. These four ARE the contract.
embedded_source_blocks = [
  "plan-closed-universe-v1",
  "plan-memory-safety-v1",
  "plan-crate-layer-table-v1",
  "plan-build-inventory-v1",
]
# Exact cardinalities the plan fixes by enumeration. A row added or dropped
# without moving these is schema drift, not an edit.
layer_count = 14
crate_count = 70
