# =============================================================================
# THE BUILD-VERSUS-CONSUME INVENTORY (§18.2 + §2.3)
# =============================================================================
# `disposition`:
#   build_here  — we write it, because the universe is closed
#   consume_from— a foundation supplies it and we must NOT restate it
#   design_only — a frankensqlite design we adopt without linking anything
#
# COVERAGE IS PROVED, NOT ASSERTED. Every build_here and consume_from row's
# `source_phrase` is deleted from the frozen §18.2 line; what remains must be
# punctuation plus the four registered rationale allowances below. A capability
# §18.2 names and this registry dropped therefore fails as leftover residue.
#
# Every design_only row's `source_phrase` must resolve to exactly one row of the
# §2.3 donor table, and the mapping must be a bijection: nine designs, nine rows.
#
# Every consume_from row additionally names the foundation asset row that
# supplies it (`foundation_asset`, resolved inside the §2.1/§2.2 blocks) — the
# "exact package/source evidence" a duplicate-subsystem argument needs.
# -----------------------------------------------------------------------------

[[residue_allowance]]
id = "not-built-marker"
text = "**Explicitly not built**:"
reason = "The section marker separating the two lists; not a capability."

[[residue_allowance]]
id = "asupersync-attribution"
text = " — all asupersync"
reason = "The attribution tail for the preceding consume_from run; each row carries the same attribution in its `foundation_project`."

[[residue_allowance]]
id = "fnx-attribution"
text = " — all fnx"
reason = "The attribution tail for the two fnx rows."

[[residue_allowance]]
id = "moat-rationale"
text = "The closed-universe constraint, which sounds like an albatross, is the moat: the entire dependency surface is auditable, deterministic under lab, and owned."
reason = "Rationale sentence, not an inventory item. Pinned verbatim so this allowance cannot be widened to hide a capability."

