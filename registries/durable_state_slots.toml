# =============================================================================
# durable_state_slots.toml — the total cross-plane durable state-slot registry (G0)
# =============================================================================
# Bead: fgdb-4ozr (the nf1 seam; parent fgdb-g0-command-contracts-nf1).
# Provenance: plan §5.1 (COMPREHENSIVE_PLAN_FOR_THE_DESIGN_OF_FRANKENGRAPHDB.md
# line 298), verbatim: "`durable_state_slots.toml` is the total cross-plane
# registry. Its rows point to exactly one backing field registry and use
# {plane,role,slot_tag,backing_registry,stable_name,exact_wire_type,
# reference_semantics,target_schema_id,activation_predicate,
# initial_value_recipe,transition_writer_contract_ids[],
# checkpoint_or_snapshot_class,floor_class,backup_class,
# restore_reconciliation_class,gc_class,role_transition_class,status}."
#
# SEED DERIVATION (the reservation-bijection law). command_contracts.toml has
# been forward-declaring DurableStateSlotRef values ("plane|role|slot_tag",
# marked [C][F] "vs absent durable_state_slots.toml") since its F1/F2 tranche.
# Those declarations are existing reservations, so rows here MINT AT THE
# RESERVED CODES: one row per distinct ref in any consumed_state_slots /
# written_state_slots array at HEAD (48 distinct refs; measured 2026-08-05,
# registry_epoch 14 of command_contracts.toml). No slot is invented here; a
# slot with no declaring contract ref does not get a row yet.
#
# Per-key derivation-authority marks (the command_contracts.toml convention):
#   [S] source-forced by the plan sentence cited beside the mark
#   [S-derived] forced indirectly; the comment names the carrier
#   [C] owner-confirmed convention
#   [F] forward-declared against an artifact that does not exist yet
#
# Key derivations used on every row below:
#   plane, role, slot_tag       [S-derived] the declaring DurableStateSlotRef
#   backing_registry            [S] the L298 plane split: SemanticPayload ->
#                               state_payload_fields.toml, Protocol ->
#                               protocol_state_fields.toml, PreparedOwnership ->
#                               prepared_state_fields.toml, Consensus ->
#                               consensus_state_fields.toml; Bootstrap slots
#                               "remain fixed-location fields validated through
#                               bootstrap_frames.toml but still receive
#                               cross-index rows", so their backing_registry is
#                               bootstrap_frames.toml.
#   stable_name                 [C] the plan state-object name the slot tag was
#                               minted from (round-12 confirmation: tags use
#                               "the plan's own state-object names"), i.e. the
#                               slot_tag itself; corrected in place if a slot's
#                               activation tranche derives a different spelled
#                               name.
#   transition_writer_contract_ids
#                               [S-derived] exactly the command_contracts.toml
#                               rows whose written_state_slots carry this ref.
#                               L298 quantifies "every ACTIVE slot names every
#                               legal writer" over active slots; a reserved
#                               row carries the writers DECLARED SO FAR, and
#                               the validator holds it equal to the derived
#                               set so the two registries cannot drift.
#   remaining keys              [F] "ReservedPendingActivation" — the reserved
#                               sentinel, legal ONLY on a status="reserved"
#                               row (the SourceUnspelled precedent), resolved
#                               in place when the slot's activation tranche
#                               derives the real value from its defining plan
#                               section. status="active" with any sentinel key
#                               is a validator refusal.
#
# WHY EVERY ROW IS status="reserved". The activation closure (plan L1466 for
# Local semantic, L1652 for Meta, L1548 for protocol recipes) and the
# generated checkpoint/snapshot/floor/backup/restore/GC/transition walkers do
# not exist at HEAD. L298: "every required checkpoint/snapshot/floor/backup/
# restore/GC/transition walker is generated from it" — generation needs the
# class keys, which are exactly the keys still reserved. The validator
# refuses status="active" until that machinery lands (the command_contracts
# live-row-refusal precedent).
#
# registry_epoch changes only when rows are added or retired.
registry_epoch = 17


