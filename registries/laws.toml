id = "FG-LAW-07"
name = "Appendix A u64 sequence"
source_location = ""
statement = ""
enforcement = ""
status = "struck"
note = "STRUCK by owner ruling in the mv6g sitting (2026-08-01, round 1; fgdb-u259): a fabrication from mint 3c1c936 — a law name invented for 'this member is a u64'. Both citing rationale rows (ConfigurationTransitionSpec a10:1920 source-position tags 3 and 4) were repaired in the same landing to state the u64 fact plainly. The row remains as the permanent record that this phrase claims no authority and must never be cited again."

