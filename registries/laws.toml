# =============================================================================
# laws.toml — the named-law registry (G0)
# =============================================================================
# Bead: fgdb-law-citation-sweep-uzzh
# Provenance: plan Appendix F preamble ("resolvable enforcement and negative-
# test entrypoints"), the same shape invariants.toml uses for FG-INV-01..20 —
# every law declared once with a stable ID, a statement, and the mechanism that
# enforces it.
#
# WHY THIS FILE EXISTS. Catalog prose cites named laws. MEASURED 2026-07-27 at
# HEAD 1d19f02: 93 such citations across 10 distinct law names, and not one of
# those names was declared anywhere in the repository. A citation is a reference
# with no referent unless something declares the referent, and a fabricated
# citation is indistinguishable from a real one when nothing resolves either.
# That is how "the Appendix A u64 floor law" — a rule that exists nowhere —
# survived every gate: appendix exit 0, identity exit 0, suite 130/130. The
# defect was never the citation. It was the missing registry.
#
# THE DISCRIMINATOR THAT DECIDED EVERY ROW BELOW. A cited law that carries a
# source location resolves; a cited law that carries none does not. That held
# for 10 of 10 names without exception:
#
#   flattened-rendering       a01:1412   real, stated verbatim at that line
#   compact-phrase            a01:1412   real, stated verbatim at that line
#   shorthand                 a01:1396   real, stated verbatim at that line
#   SequenceNeutralSpec       a10:1914   real, stated verbatim at that line
#   D1 closure                a10:1912   location real, LAW NOT STATED THERE
#   arm-payload-shape         (none)     unlocatable
#   Appendix A u64 sequence   (none)     unlocatable
#   Appendix A u64 index      (none)     unlocatable
#   Appendix A u64 floor      (none)     unlocatable
#
# So `source_location` is REQUIRED on a registered row. It is the field that
# makes a law falsifiable: a reader can open the line and check.
#
# STATUS IS WHAT A FUTURE GUARD KEYS ON, and the three values are not
# decorative:
#   registered           the rule is adopted and anchored at source_location
#                        (aNN:LINE or plan:LINE for a stated plan line;
#                        enforcement:NAME for a rule whose authority is the
#                        checker law that enforces it). A citation resolving
#                        here is licensed.
#   unadjudicated        cited, and something real is being pointed at, but its
#                        legal status is not established. A citation resolving
#                        here is NOT yet licensed; it is owner-facing work.
#   fabrication-candidate cited, with no locatable referent. A citation
#                        resolving here must FAIL once the guard lands.
#   struck               adjudicated a fabrication by owner ruling; its
#                        citations were repaired away in the same landing, the
#                        name licenses nothing, and the row remains as the
#                        permanent record.
#
# STRIKE RECORD. FG-LAW-07 and FG-LAW-08 were struck by owner ruling on
# 2026-08-01 (mv6g sitting, fgdb-u259) with their three citations repaired in
# the same landing. The rows remain — deleting them would destroy the only
# record of what the catalog once believed its own rules were, and the struck
# status is what makes a future re-citation fail rather than resurrect them.
#
# Row schema:
#   [[law]]
#   id              = "FG-LAW-NN"        # stable, permanent, never reused
#   name            = "..."              # the phrase catalog prose cites
#   source_location = "aNN:LINE"         # REQUIRED when status = "registered";
#                                        # also "plan:LINE" (statement outside
#                                        # the appendix slices) or
#                                        # "enforcement:NAME" (checker-law
#                                        # anchored, mv6g sitting 2026-08-02)
#   statement       = "..."              # what the rule actually says
#   enforcement     = "..."              # REQUIRED when status = "registered"
#   status          = "registered" | "unadjudicated" | "fabrication-candidate"
#   cited_as        = ["..."]            # optional alternate surface phrasings
#   note            = "..."              # optional adjudication record
#
# `cited_as` SHARES THE `name` NAMESPACE. One rule can be cited under more than
# one wording, and the citation guard resolves a surface phrase against names
# and aliases alike, so an alias colliding with any other name or alias is
# rejected: a citation must not resolve to two laws.
#
# Unknown keys are REJECTED, not ignored: a future field added to some rows and
# silently dropped on others is the same failure mode this registry exists to
# end.
# =============================================================================

[[law]]
id = "FG-LAW-01"
name = "flattened-rendering"
source_location = "a01:1412"
statement = "Appendix A schema bodies use a flattened prose rendering, and names and suffixes never imply reference strength. Every field's exact type, cardinality, identity class, target, role/posture predicate, retention and cut behavior, and PriorObject construction annotation come from the generated durable_fields.toml row rather than from the source spelling."
enforcement = "The rendering checker rejects any brace field that lacks or disagrees with its durable_fields.toml row; exercised by `registry-check appendix` over the Appendix A census."
status = "registered"
note = "The most-cited law in the catalog. Its citations carry the a01:1412 anchor inline, which is why it was verifiable at all."

[[law]]
id = "FG-LAW-02"
name = "compact-phrase"
source_location = "a01:1412"
statement = "A compact phrase appearing in a schema body, such as \"typed mandatory inventory\", names a closed sub-schema. It is never an open bag and never a slash-separated set of ambient refs."
enforcement = "Appendix A census classification: a compact phrase resolves to a named closed sub-schema or the slice fails G0; exercised by `registry-check appendix`."
status = "registered"
note = "Stated on the same plan line as FG-LAW-01. Directly relevant to fgdb-census-slash-token-truncation-avex: this law already forbids reading a slash-separated token as an ambient set."

[[law]]
id = "FG-LAW-03"
name = "shorthand"
source_location = "a01:1396"
statement = "A shorthand authority_group_id, consumer_group_id, or group_id in a cross-group schema means the corresponding full ConsensusDomain; wire encoders never serialize the scalar alone."
enforcement = "Appendix A census expands the shorthand to ConsensusDomain when classifying a cross-group schema member; exercised by `registry-check appendix`."
status = "registered"
note = "Cited as \"the shorthand law\" with the a01:1396 anchor carried after the phrase rather than before it, which is why a location-prefix reader missed it."

[[law]]
id = "FG-LAW-04"
name = "SequenceNeutralSpec"
source_location = "a10:1914"
statement = "Every typed sequence-neutral spec is canonically encoded once as SequenceNeutralSpec<Tag> {wire_tag, schema_version, body, terminal_audit_freeze, terminal_audit_gate}. Appendix prose flattens the body fields into the surrounding braces for readability, so a shown audit field is a wrapper field and not a field inside the body."
enforcement = "Appendix A census attributes wrapper fields to the wrapper rather than to the body; exercised by `registry-check appendix`."
status = "registered"
cited_as = ["SequenceNeutralSpec wrapper"]
note = "Cited both as \"the SequenceNeutralSpec law\" and \"the SequenceNeutralSpec wrapper law\"; both name this rule. The second phrasing is declared in cited_as so the citation guard resolves it by registry lookup: rewriting the catalog instead would be a coordinated edit across the catalog and every projection generated from it."

[[law]]
id = "FG-LAW-05"
name = "D1 closure"
source_location = "plan:392"
statement = "Payload durability barrier D1 is complete only when the final semantic capsule AND its entire mandatory strong closure are sealed and directory-durable: the prepared record inserted, authenticated nonretaining locator entries published, the updated RootManifest persisted, and a RootSlot durably published before D1 is complete or a payload receipt may be emitted. Bytes not yet admitted to a prepared root remain staging data and are unreachable after a crash."
enforcement = "Chronicle's two-fsync commit path enforces closure-before-receipt at runtime, with the §15 crash-point matrix as its permanent CI gate; catalog retention rules cite the law for StrongRef retention of D1-closure members (e.g. the candidate PayloadAvailabilityCertificate held while ConfigurationTransitionSpec is retained)."
status = "registered"
note = "Promoted by owner ruling in the mv6g sitting (2026-08-01/02, rounds 3 and 6; swarm OWNER_RULINGS record). The original citation carried anchor a10:1912, which is real but defines the transaction order unit and states no closure law; the statement lives at plan line 392 (§5.2 step 5), and the plan:LINE anchor form was added to carry it. The citing catalog row still carries the stale a10:1912 inline anchor in its prose; this row's anchor supersedes it."

[[law]]
id = "FG-LAW-06"
name = "StrongRef-only arm-payload-shape"
source_location = "enforcement:field_unresolved_schema"
statement = "A generated closed-union arm whose payload is a single StrongRef member is committed byte-exactly by the covering arm payload digest and registered on the wire path with no [[field]] row; a [[field]] row may never hang off a wire-only schema."
enforcement = "field_unresolved_schema: registry-check appendix rejects any field row naming a wire-only host, and the landed corpus carries zero field rows on wire hosts."
status = "registered"
note = "Registered by owner ruling in the mv6g sitting (2026-08-01/02, rounds 3 and 6): the rule is real and enforcement-anchored. No plan line states it — the enforcement:NAME anchor form exists for exactly this shape, rather than inventing a prose anchor the plan does not contain."

