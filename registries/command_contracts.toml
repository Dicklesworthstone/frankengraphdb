# authority, consumer, or transition-consumer posture and rejects a
# record/evidence type in the wrong arm" (L1582), recorded per-row in
# posture_feature_predicate instead of the C-g "always" default.
#
# C11 (round 10): the four Remote*Spec sub-bodies the arms name are PRE-ORDER
# payloads reached via StrongRef — they get PreOrderArtifact classification
