# is the LAST F5 member: ruling C2 (round 10) included it in F5 at the position
# the freeze proposal gave it, immediately after the format transition, so the
# dense ordinal following F5c's 26 is 27. The F5a header's "configuration,
# format, and delta-retention members remain in their own ordered increment"
# recorded exactly this deferral. The exact struct body is never spelled —
# L1930 names the command, its evidence (DeltaRetentionCutEvidence<Role>), and
# its apply obligations only — so body-dependent audit keys record the
# SourceUnspelled sentinel per T6, legal only on reserved rows.
#
# NOTE ON THE PREDECESSOR HANDOFF: the wedged pane's proposal named this
# increment "F6 ... ordinal 27+". Re-derived against the frozen order (the
# round-10 confirmation makes the proposal doc the frozen object, C2 resolved
# INCLUDE-in-F5): ordinal 27 belongs to this F5 member and F6 owns 28-30.
# Landing F6 at 27 would have minted permanently wrong tags (plan line 290).
# =============================================================================
[[contract]]
command_contract_id = "cc:local:local-delta-batch-retention-cut-spec"     # [C]
role = "Local"                                                            # [S]
outer_command_union = "SequenceNeutralSpec<Tag>"                          # [S]
outer_wire_tag = 0x001b                                                   # [S] frozen dense ordinal 27
input_schema_id = "LocalDeltaBatchRetentionCutSpec"                       # [S] L1930 "the role-specific ordered" command (struct body unspelled)
input_wire_tag = 0x001b                                                   # [C]
body_schema_id = "LocalDeltaBatchRetentionCutSpec"                        # [S]
result_schema_id = "ActivatedDeltaRetentionCut<Local>"                    # [S] L1930 "may install ActivatedDeltaRetentionCut<Role>"
applied_record_schema_id = "LocalDeltaBatchIndex"                         # [S] L1928/1930: advances retained_after_commit_seq and active_cut_ref
handler_symbol = "fgdb_apply::local::local_delta_batch_retention_cut_spec"  # [C][F]
transition_class = "Semantic"                                             # [S] C2: an F5 member of the L1916 semantic registry; L1930 "role-specific ordered"
sequence_effects = "may install the activated cut and advance retained_after_commit_seq only after the paired checkpoint/floor and ordinary activated retention cut cover the same position; apply replaces old strong entries with the prefix commitment in the same state transition; a missing retained entry is corruption, and a query below a proved cut returns HistoryUnavailable or the already-recorded gap contract"  # [S] L1930
expected_state_schema_id = "LocalDeltaBatchIndex"                         # [S] L1930 basis_index_digest names the index as the cut basis
authority_arm = "DeltaRetentionCutEvidence<Local>"                        # [S-derived] C-h tier 3: the cut is evidence-authorized (L1930 complete_obligation_bijection)
authority_evidence_target_schema_id = "DeltaRetentionCutEvidence<Local>"  # [S] L1930 exact evidence schema
terminal_audit_freeze_arm = "SourceUnspelled"                             # T6: no struct body spelled anywhere
terminal_audit_gate_arm = "SourceUnspelled"                               # T6
payload_availability_rule = "pre-command semantic base closure per plan:392 (FG-LAW-05)"  # [S]
publication_mode = "SinglePlane"                                          # [S]
construction_dag_recipe_id = "dag:cc:local:local-delta-batch-retention-cut-spec"  # [C][F]
