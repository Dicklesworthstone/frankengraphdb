# AuditTerminalSpec (58); AuditRecoverySpec (59); AuditCompletenessTransition-
# Spec<Local> (60). AuditSigningAttemptSupersedeSpec stays MAINTENANCE per
# I-4's sibling note (L1848 "nonsemantic maintenance input") and takes no row
