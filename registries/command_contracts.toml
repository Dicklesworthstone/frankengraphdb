# =============================================================================
# command_contracts.toml — the role-valid command-arm contract registry (G0)
# =============================================================================
# Bead: fgdb-5uw2
# Provenance: plan §5.1 (COMPREHENSIVE_PLAN_FOR_THE_DESIGN_OF_FRANKENGRAPHDB.md
# line 294), verbatim: "Ordered transitions have one further normative registry,
# `command_contracts.toml`; hand-written lists in this document are generated
# readability projections and are never a second source of truth. One row exists
# for every role-valid command arm."
#
# WHY THIS FILE WAS CREATED WITH ZERO ROWS. Plan line 296 makes this registry
# half of a G0-enforced two-way total bijection — but the bijection quantifies
# over LIVE rows and INHABITABLE command-union arms: "Every inhabitable Local,
# Meta, or Shard command-union arm resolves to exactly one live command-contract
# row; every live row resolves to exactly one union arm, one registered
# canonical input, one exact body/result/applied-record triple, and one
# exhaustive Rust apply handler." MEASURED 2026-07-28 at HEAD 5d42e28: the
# SequenceNeutralSpec and GlobalSequenceNeutralSpec family unions carry zero
# landed arms (registries/appendix_a_catalog.toml; see fgdb-5ekk), and no Rust
# apply handler exists. Zero rows was therefore the only population this file
# could honestly carry at creation, and it was bijection-consistent: both
# quantification domains were empty.
#
# WHY THE FIRST ROW WAS NOT LANDED AT CREATION (the tag-permanence law). Plan
# line 288 makes this registry the generation source for the SequenceNeutralSpec
# / role-command wire inventories, so `outer_wire_tag` values minted here are
# the authority, and plan line 290 makes released tags permanent. Assigning tags
# to a PARTIAL row population risks colliding with the canonical order of the
# full family expansion (plan lines 1916, 1918, 1770 name the families; each
# family's exact inner tags are spelled at its own section of the plan). Rows
# therefore waited for the complete expansion, tracked on fgdb-5uw2 (Phase B in
# its notes).
#
# PHASE B OPENED (2026-08-02/03). The complete v1 family expansion was derived
# (Local families F1-F16 in the L1916 sentence order, Meta from L1770; swarm
# round-10 record) and the owner confirmed: the freeze of both unions' full
# command-tag ORDER; the row-derivation conventions (contract id
# "cc:{role-lower}:{kebab(member)}[:{kebab(inner-arm)}]", forward-declared
# handler symbols "fgdb_apply::{role}::{snake(member)}", dag recipe ids
# "dag:{contract-id}", tight-quoted sequence_effects from the member's apply
# sentence, slot tags forward-declared against the absent
# durable_state_slots.toml using the plan's own state-object names, "v1.."
# epoch ranges, "always" posture default); and the input_wire_tag semantics
# (= outer_wire_tag for armless members — one tag space per union;
# inner_wire_tag covers family arms). outer_wire_tag is the dense ordinal
# 0x0001 + position in the frozen order. Rows now land family-by-family in that
# order, every row status = "reserved" until its arm, canonical input,
# body/result/applied-record triple, and handler exist (the live-row bijection
# enumerators are still unbuilt and the validator refuses "live"). This
# increment lands the F1/F2 seed: frozen ordinals 1-3.
#
# Per-key derivation-authority marks used on the rows below:
#   [S] source-forced (the plan spells it; the citation is beside the mark)
#   [C] owner-confirmed convention (the 2026-08-02 template confirmation)
#   [F] forward-declared (names an artifact/registry that does not exist yet;
#       legal per the reserved-row doctrine, resolved when that artifact lands)
#
# SCOPE BOUNDARY. invariants.toml line 312 names this registry AND
# `state_payload_fields.toml` ("roots every written state class"). That third
# registry is NOT created by this increment; its absence is unchanged and its
# construction needs its own bead.
#
# Row schema — verbatim from plan §5.1 line 294; a key marked `?` is optional,
# every other key is required on every row. No row may carry a key outside this
# set (the loader rejects unknown keys before reading any field).
#
#   [[contract]]
#   command_contract_id                  = "..."   # stable, permanent, never reused
#   role                                 = "Local" | "Meta" | "Shard"
#   outer_command_union                  = "..."
#   outer_wire_tag                       = 0x....  # u16; permanent once released
#   input_schema_id                      = "..."
#   input_wire_tag                       = 0x....  # u16
#   inner_wire_tag                       = 0x....  # u16, optional
#   body_schema_id                       = "..."
#   result_schema_id                     = "..."
#   applied_record_schema_id             = "..."
#   handler_symbol                       = "..."
#   transition_class                     = "Semantic" | "Maintenance" | "Scaffolding"
#   sequence_effects                     = "..."
#   expected_state_schema_id             = "..."
#   authority_arm                        = "..."
#   authority_evidence_target_schema_id  = "..."   # optional
#   terminal_audit_freeze_arm            = "..."
#   terminal_audit_gate_arm              = "..."
#   payload_availability_rule            = "..."
#   publication_mode                     = "SinglePlane" | "AtomicProtocolDetach{cross_plane_conservation_recipe_id}"
#   construction_dag_recipe_id           = "..."
#   consumed_state_slots                 = [ "plane|role|slot_tag", ... ]  # DurableStateSlotRef; plane in
#   written_state_slots                  = [ "plane|role|slot_tag", ... ]  # SemanticPayload|Protocol|PreparedOwnership|Consensus|Bootstrap
#   checkpoint_floor_classes             = [ "...", ... ]
#   backup_restore_gc_classes            = [ "...", ... ]
#   posture_feature_predicate            = "..."
#   format_epoch_range                   = "..."
#   status                               = "reserved" | "live" | "retired"
#
# "Rows are per concrete inner tag: an outer DpTransition, RemoteRetention,
# configuration, delivery, GC, backup, restore, format, bulk, derived-build, or
# audit-lifecycle family never hides an open subcommand." (plan line 294)
#
# registry_epoch changes only when rows are added or retired (plan line 290).
registry_epoch = 2

# =============================================================================
# F1 guarded-recovery-bootstrap — frozen ordinal 1 (L1916 sentence order)
# =============================================================================
[[contract]]
command_contract_id = "cc:local:recovery-bridge-spec"                     # [C] id convention
role = "Local"                                                            # [S] the frozen Local table
outer_command_union = "SequenceNeutralSpec<Tag>"                          # [S] L1916; catalog spelling (a21 gate-union row)
outer_wire_tag = 0x0001                                                   # [S] frozen dense ordinal 1
input_schema_id = "RecoveryBridgeSpec<Local>"                             # [S] L340/L2561
input_wire_tag = 0x0001                                                   # [C] = outer for armless members (owner-confirmed)
body_schema_id = "RecoveryBridgeSpec<Local>"                              # [S] L2561: the spec IS "the exact role-specialized first-control body"
result_schema_id = "LogicalCommandRecord"                                 # [S] L340: origin RecoveryBridge enters the LogicalCommandRecord
applied_record_schema_id = "LogicalStateRoot"                             # [S] L340 first-root publication
handler_symbol = "fgdb_apply::local::recovery_bridge_spec"                # [C][F] forward-declared handler path
transition_class = "Semantic"                                             # [S] F1 semantic union member (L1916/L1918)
sequence_effects = "sole legal first ordered command of a restored incarnation; creates the LocalCommandOrigin::RecoveryBridge origin; forbidden after any Prior-origin command exists"  # [S] L340 'only the first guarded restore command'
expected_state_schema_id = "PendingRestoreCreationGuard<Local>"           # [S] L2563 sole consumer guard
authority_arm = "RecoveryBridgeAuthority<Local>"                          # [S] L2561 authority member
terminal_audit_freeze_arm = "Forbidden"                                   # [S] no freeze member spelled in the L2561 body
terminal_audit_gate_arm = "StructurallyInapplicable{RecoverySystemAuthority}"  # [S] L2561 verbatim: terminal_audit_gate:StructurallyInapplicable{RecoverySystemAuthority}
payload_availability_rule = "pre-command semantic base closure per plan:392 (FG-LAW-05)"  # [S]
publication_mode = "SinglePlane"                                          # [S] no detach spelled
construction_dag_recipe_id = "dag:cc:local:recovery-bridge-spec"          # [C][F] dag convention
consumed_state_slots = [ "Bootstrap|Local|pending_restore_creation_guard" ]         # [C][F] vs absent durable_state_slots.toml
written_state_slots = [ "SemanticPayload|Local|logical_state_root", "Bootstrap|Local|restore_bridge_origin" ]  # [C][F]
checkpoint_floor_classes = [ "genesis-or-restore-first-root" ]            # [C][F]
backup_restore_gc_classes = [ "restore-bridge" ]                          # [C][F]
posture_feature_predicate = "always"                                      # [C] no posture gate spelled at the defining site
format_epoch_range = "v1.."                                               # [C] open-ended from the v1 freeze
status = "reserved"                                                       # [S] reserved until arm/input/triple/handler exist

