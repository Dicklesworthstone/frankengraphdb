source_location = "a07:1770"
statement = "AuditExternalResolutionBatch/receipt are pre-order evidence and AuditVisibilityAdvanceSpec is a Protocol-plane maintenance input, never a GlobalSequenceNeutralSpec."
status = "registered"

[[classification]]
type_name = "AuditExternalResolutionReceipt"
class = "PreOrderArtifact"
source_location = "a07:1770"
statement = "AuditExternalResolutionBatch/receipt are pre-order evidence and AuditVisibilityAdvanceSpec is a Protocol-plane maintenance input, never a GlobalSequenceNeutralSpec."
status = "registered"

