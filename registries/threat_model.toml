# -----------------------------------------------------------------------------
# EffectiveAuthority dimensions, in §12.1 source order, then the four §12.2
# dimensions the attenuation law adds. The lattice has NO independent order:
# its order is exactly the conjunction of these per-dimension narrowing
# operators. That is why every dimension must declare one and why an
# unclassified dimension is a checker failure rather than a default.
#
#   fixed                      - identical in every link; part of the retained root tuple
#   intersect                  - the link's value must be a subset of the prior value
#   raise_only                 - the link may only move the bound up
#   lower_only                 - the link may only move the bound down
#   append_only                - the link may only add entries
#   restrict_disclosure_only   - the link may only reduce what is disclosed
#   restrict_binding_only      - the link may only move to a same-or-higher binding rank
#   current_state_monotone     - not narrowed by the chain; supplied by monotone current state
# -----------------------------------------------------------------------------

[[authority_dimension]]
id = "tenant"
source_order = 1
narrowing_operator = "fixed"
summary = "The tenancy the authority is bound to."
source_anchor = "§12.1"

[[authority_dimension]]
id = "subject"
source_order = 2
narrowing_operator = "fixed"
summary = "The principal the authority speaks for."
source_anchor = "§12.1"

[[authority_dimension]]
id = "issuer"
source_order = 3
narrowing_operator = "fixed"
summary = "The root issuer identity."
source_anchor = "§12.1"

[[authority_dimension]]
id = "audience"
source_order = 4
narrowing_operator = "fixed"
summary = "The audience the root was minted for."
source_anchor = "§12.1"

[[authority_dimension]]
id = "database_security_namespace"
source_order = 5
narrowing_operator = "fixed"
summary = "The database security namespace the authority is scoped to."
source_anchor = "§12.1"

[[authority_dimension]]
id = "cluster_incarnation"
source_order = 6
narrowing_operator = "fixed"
summary = "The cluster incarnation the namespace is scoped by."
source_anchor = "§12.1"

[[authority_dimension]]
id = "token_epoch"
source_order = 7
narrowing_operator = "fixed"
summary = "The token's MAC key epoch, retained from the immutable root tuple."
source_anchor = "§12.1"

[[authority_dimension]]
id = "security_policy_epoch"
source_order = 8
narrowing_operator = "fixed"
summary = "The security-policy epoch the authority is verified against."
source_anchor = "§12.1"

[[authority_dimension]]
id = "revocation_index"
source_order = 9
narrowing_operator = "current_state_monotone"
summary = "The current revocation index. Supplied by authenticated current state, not by the chain: a token cannot carry a stale index forward as if it were narrowing."
source_anchor = "§12.1"

[[authority_dimension]]
id = "operation_classes"
source_order = 10
narrowing_operator = "intersect"
