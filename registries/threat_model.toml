# =============================================================================
# POSTURES AND THE PRODUCT-SPACE CLOSURE LAW
# =============================================================================
# A posture is not a name on a list; it is an admissible cell of a declared
# product space. The checker enumerates every cell of service_class x
# role_posture x continuity_profile and proves each is exactly one of:
# registered, deferred with a named owner bead, or excluded by a named law.
# =============================================================================

[posture_product_space]
service_class_axis = ["Operational", "ArchiveReadOnly"]
role_posture_axis = ["Local", "Sharded"]
continuity_profile_axis = ["DirectoryBound", "ExternalCas", "NotApplicable"]
cell_count = 12

[[exclusion_law]]
id = "PX-1"
statement = "role_posture = Sharded implies continuity_profile = ExternalCas."
rationale = "W12 requires ExternalCas; the AllocationContinuityProfile is bound one-to-one to the slot's IncarnationContinuityProfile, so a sharded DirectoryBound slot cannot exist."
source_anchor = "§5.1"

[[exclusion_law]]
id = "PX-2"
statement = "service_class = ArchiveReadOnly implies continuity_profile = NotApplicable."
rationale = "An archive open performs no incarnation takeover, mints no writer, and mints no service-promotion receipt, so it consumes no incarnation or allocation continuity fence at all."
source_anchor = "§13.7"

[[exclusion_law]]
id = "PX-3"
statement = "service_class = Operational implies continuity_profile != NotApplicable."
rationale = "Every operational slot is fenced by exactly one registered IncarnationContinuityProfile arm before it may write."
source_anchor = "§5.1"

[[posture]]
id = "local_directory_bound"
title = "Local, DirectoryBound (the embedded posture)"
service_class = "Operational"
role_posture = "Local"
continuity_profile = "DirectoryBound"
status = "frozen"
footprint_declaration = "empty"
empty_justification = "The embedded DirectoryBound posture's footprint table is empty: it consumes zero external authorities. The epoch fence is a local allocation-continuity journal record ordered under the same whole-inode fence and fixed local continuity digest the cluster-incarnation record registers for that profile."
source_anchor = "§16.8"

[[posture]]
id = "local_external_cas"
title = "Local, ExternalCas"
service_class = "Operational"
role_posture = "Local"
continuity_profile = "ExternalCas"
status = "frozen"
footprint_declaration = "complete"
empty_justification = ""
source_anchor = "§16.8"

[[deferred_posture]]
id = "sharded_external_cas"
title = "Sharded, ExternalCas"
service_class = "Operational"
role_posture = "Sharded"
continuity_profile = "ExternalCas"
owner_bead = "fgdb-w12-meta-authority-transfer"
reason = "Sharding is W12, after 1.0. The cell is admissible under the product-space laws and its footprint is a W12 deliverable; freezing Meta-side and shard-side sync-path positions here would manufacture a G0 fact from an unbuilt protocol."

[[deferred_posture]]
id = "archive_read_only_open"
title = "ArchiveReadOnly, Local"
service_class = "ArchiveReadOnly"
role_posture = "Local"
continuity_profile = "NotApplicable"
owner_bead = "fgdb-g0-format-arms-90z"
reason = "§13.7 states in terms that the open-class, posture, and filesystem-profile-variant registry rows are reserved in the §19 G0 decision batch, which g0-format-arms owns. This registry supplies the posture vocabulary that bead consumes."

# -----------------------------------------------------------------------------
# The v1 footprint for local_external_cas. Every cell states whether the
# authority sits on a synchronous operation path and exactly where.
#
# operation_class_basis is "trigger_site_only" for all eleven rows, and that is
# a deliberate, checked limitation rather than an oversight: §16 item 8 names
# the trigger site for each authority but never names which of the sixteen
# operation classes the realized path uses. Binding realized operation classes
# is fgdb-w9-authority-surface-gp9j's deliverable, against implemented paths.
# -----------------------------------------------------------------------------

[[footprint]]
