# -----------------------------------------------------------------------------
# Trust assumptions. Every exposure cell names exactly one of these. An
# assumption is a load-bearing premise, not a hope: each states what it grants
# and, where the plan bounds it, what it explicitly does not.
# -----------------------------------------------------------------------------

[[assumption]]
id = "A-PROCESS-TRUSTED"
statement = "The baseline trusts the executing database process and the active key boundary to enforce plaintext confidentiality and policy."
bounds = "Holds only while that process is uncompromised; A-NO-TEE states the consequence when it is not."
source_anchor = "§12.1"

[[assumption]]
id = "A-NO-TEE"
statement = "A compromised server process can exfiltrate what it can decrypt, and this plan claims no TEE or Byzantine-confidentiality magic."
bounds = "This is a limitation, not a defense. No normative text may claim confidentiality against a compromised server process."
source_anchor = "§12.1"

[[assumption]]
id = "A-RAFT-CRASH-ONLY"
statement = "Ordinary Raft tolerates crash faults, not Byzantine replicas."
bounds = "A replica that lies is out of scope (OOS-BYZANTINE-CONSENSUS), not a covered failure."
source_anchor = "§12.1"

[[assumption]]
id = "A-WITNESS-DETECT-ONLY"
statement = "Witnessed transparency and audit may detect only their scoped history and administrative attacks, not undo disclosure."
bounds = "Non-equivocation claims are conditional on the declared witnessed-transparency premises of FG-INV-08; detection is not prevention and never restores confidentiality."
source_anchor = "§12.1"

[[assumption]]
id = "A-HOST-CODE-TRUSTED"
statement = "Embedded host code sharing the process address space is inside the trust boundary."
bounds = "This is why native procedures are categorically barred from replicated logical effects, merge/apply, constraints, and replay-guaranteed queries: a conformance test cannot prove arbitrary native code deterministic."
source_anchor = "§12.1"

[[assumption]]
id = "A-EXTERNAL-AUTHORITY-IN-BOUNDARY"
statement = "The external authorities are inside the declared trust boundary and carry their own registered HA and durability contract: threshold signer sets with registered rotation, durable CAS heads with an explicit anti-rollback story, and a specified successor-authority migration."
bounds = "Availability of an authority is an slo row, never an invariant; a permanently dead authority is escaped only by a threshold-authorized succession transition."
source_anchor = "§16.8"

[[assumption]]
id = "A-DONOR-UNTRUSTED-BYTES"
statement = "Donor-supplied bytes are verified against content-addressed identity and the receiver's own closure requirements before use."
bounds = "Decode proofs alone establish neither backup completeness nor semantic validity."
source_anchor = "§12.1"

[[assumption]]
id = "A-STORAGE-CIPHERTEXT-ONLY"
statement = "A party that holds or witnesses stored bytes observes ciphertext and declared metadata, never plaintext."
bounds = "Object sizes, counts, and access order remain observable; that residual is governed by A-LEAKAGE-MEASURED-NOT-PROVED."
source_anchor = "§12.1"

[[assumption]]
id = "A-TENANT-ISOLATION-BY-AUTHORITY"
statement = "Isolation between principals and tenants is enforced by EffectiveAuthority and descriptor masking before any observation or effect, not by deployment separation or post-filtering."
bounds = "Caveats compile to mandatory planner predicates; security applies before expansion, never as a post-filter (FG-INV-20)."
source_anchor = "§12.1"

[[assumption]]
id = "A-LEAKAGE-MEASURED-NOT-PROVED"
statement = "Timing, cardinality, and error leakage is acknowledged; padding, quantization, pools, and bounded errors are mitigations, and any mutual-information or channel-capacity result is a deployment-specific StatisticalClaim."
bounds = "Adversarial CI fixtures do not prove universal noninterference or a global bits-per-query ceiling. Carried by FG-EVID-05."
source_anchor = "§12.6"

# -----------------------------------------------------------------------------
# Registered out-of-scope failures (§3.4). These are rejections with recorded
# reasons, not omissions. A mechanism listed here may not be assumed by any
# downstream claim.
# -----------------------------------------------------------------------------

[[out_of_scope]]
id = "OOS-FHE-MPC-ORAM"
title = "FHE, MPC, and ORAM"
statement = "FHE, MPC, and ORAM are rejected from the initial threat model."
rationale = "Their cost model is incompatible with the §17 performance contract, and none of them changes the compromised-server exposure that A-NO-TEE already declares."
rejection_anchor = "§3.4 (i)"

[[out_of_scope]]
id = "OOS-TEE"
title = "TEE reliance"
statement = "No claim rests on a trusted execution environment."
rationale = "The baseline already trusts the executing process; a TEE would move that boundary without the plan owning its attestation, rollback, and side-channel surface."
rejection_anchor = "§12.1"

[[out_of_scope]]
id = "OOS-BYZANTINE-CONSENSUS"
title = "Byzantine consensus"
statement = "Byzantine-fault-tolerant consensus is out of scope; ordinary Raft tolerates crash faults only."
rationale = "A lying replica is not a covered failure. Detection of scoped history attacks comes from witnessed transparency, which is a different mechanism with a different claim class."
rejection_anchor = "§12.1"

[[out_of_scope]]
id = "OOS-TRUETIME"
title = "TrueTime-class infrastructure"
statement = "TrueTime-class time infrastructure is rejected for 1.0."
rationale = "HLC plus consensus-fenced read contracts supplies the semantics actually specified, not arbitrary follower linearizability."
rejection_anchor = "§3.4 (h)"

[[out_of_scope]]
id = "OOS-NONINTERFERENCE-PROOF"
title = "Noninterference by measurement"
statement = "Differential privacy and leakage measurements are scoped mechanisms, never substitutes for noninterference."
rationale = "A measured channel bound under one fixture, workload, and concurrency assumption is a statistical claim; promoting it to a semantic guarantee is exactly the claim-class violation the constitution's lattice forbids."
rejection_anchor = "§3.4"

