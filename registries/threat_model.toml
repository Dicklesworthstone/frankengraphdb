# -----------------------------------------------------------------------------
# Presentation binding classes and the complete narrowing transition matrix.
#
# The rank order is derived, not asserted: §12.2 permits a link to "preserve or
# further restrict presentation binding" and forbids changing "Session/Channel
# binding to a less restrictive class". ServerInternal is the base class that
# binds no presentation; SessionBound adds a session and auth generation;
# ChannelBound adds a transport exporter digest. A transition is legal exactly
# when it does not lower the rank. All nine cells are registered so the illegal
# ones are declared rather than merely absent.
# -----------------------------------------------------------------------------

[[presentation_binding]]
name = "ServerInternal"
rank = 0
summary = "No presentation binding: the token is exercised inside the server with no session or channel proof."
source_anchor = "§12.2"

[[presentation_binding]]
name = "SessionBound"
rank = 1
summary = "Bound to a session binding and auth generation; presentation requires that live session."
source_anchor = "§12.2"

[[presentation_binding]]
name = "ChannelBound"
rank = 2
summary = "Bound to a transport exporter digest; presentation requires that exact channel."
source_anchor = "§12.2"

[[binding_transition]]
from = "ServerInternal"
to = "ServerInternal"
legal = true
law = "preserve"

[[binding_transition]]
from = "ServerInternal"
to = "SessionBound"
legal = true
law = "further_restrict"

[[binding_transition]]
from = "ServerInternal"
to = "ChannelBound"
legal = true
law = "further_restrict"

[[binding_transition]]
from = "SessionBound"
to = "ServerInternal"
legal = false
law = "weakened_binding"

[[binding_transition]]
from = "SessionBound"
to = "SessionBound"
legal = true
law = "preserve"

[[binding_transition]]
from = "SessionBound"
to = "ChannelBound"
legal = true
law = "further_restrict"

[[binding_transition]]
from = "ChannelBound"
to = "ServerInternal"
legal = false
law = "weakened_binding"

[[binding_transition]]
from = "ChannelBound"
to = "SessionBound"
legal = false
law = "weakened_binding"

[[binding_transition]]
from = "ChannelBound"
to = "ChannelBound"
legal = true
law = "preserve"

# -----------------------------------------------------------------------------
# The attenuation law: six permitted mutations, five prohibitions. This is the
# definition of the lattice order, so every row names the dimensions it governs
# and the negative fixture that must reject its violation.
# -----------------------------------------------------------------------------

[[attenuation_law]]
id = "ATT-P1"
class = "permitted"
mutation = "raise_effective_not_before"
statement = "A chain link may raise the effective not-before."
dimension_ids = ["effective_not_before"]
negative_fixture = "tm_neg_time_extension"
source_anchor = "§12.2"

[[attenuation_law]]
id = "ATT-P2"
class = "permitted"
mutation = "lower_effective_expiry"
statement = "A chain link may lower the effective expiry."
dimension_ids = ["effective_expires_at"]
negative_fixture = "tm_neg_time_extension"
source_anchor = "§12.2"

[[attenuation_law]]
id = "ATT-P3"
class = "permitted"
mutation = "intersect_authority_scope"
statement = "A chain link may intersect authority scopes."
dimension_ids = [
  "operation_classes",
  "graph_scope",
  "branch_scope",
  "label_scope",
  "edge_scope",
  "property_scope",
  "system_field_scope",
  "temporal_scope",
  "procedure_udf_module_object_ids",
  "invocation_mode",
  "external_io_classes",
  "replay_evidence_resolver_closure",
]
negative_fixture = "tm_neg_scope_widening"
source_anchor = "§12.2"

[[attenuation_law]]
id = "ATT-P4"
class = "permitted"
mutation = "intersect_resource_scope"
statement = "A chain link may intersect resource scopes."
dimension_ids = ["resource_ceiling"]
negative_fixture = "tm_neg_scope_widening"
source_anchor = "§12.2"

[[attenuation_law]]
id = "ATT-P5"
class = "permitted"
mutation = "append_accepted_caveats"
statement = "A chain link may append accepted caveats."
dimension_ids = ["accepted_caveats"]
negative_fixture = "tm_neg_caveat_removal"
source_anchor = "§12.2"

[[attenuation_law]]
id = "ATT-P6"
class = "permitted"
mutation = "preserve_or_restrict_presentation_binding"
statement = "A chain link may preserve or further restrict the presentation binding."
dimension_ids = ["presentation_binding"]
negative_fixture = "tm_neg_binding_weakening"
source_anchor = "§12.2"

[[attenuation_law]]
id = "ATT-X1"
class = "prohibited"
mutation = "extend_time"
statement = "A chain link cannot extend time."
dimension_ids = ["effective_not_before", "effective_expires_at"]
negative_fixture = "tm_neg_time_extension"
source_anchor = "§12.2"

[[attenuation_law]]
id = "ATT-X2"
class = "prohibited"
mutation = "change_authority_domain"
statement = "A chain link cannot change the authority domain."
dimension_ids = [
  "tenant",
  "subject",
  "issuer",
  "audience",
  "database_security_namespace",
  "cluster_incarnation",
  "token_epoch",
  "security_policy_epoch",
]
negative_fixture = "tm_neg_domain_change"
source_anchor = "§12.2"

[[attenuation_law]]
id = "ATT-X3"
class = "prohibited"
mutation = "widen_disclosure"
statement = "A chain link cannot widen disclosure."
dimension_ids = ["redaction_profile"]
negative_fixture = "tm_neg_disclosure_widening"
source_anchor = "§12.2"

[[attenuation_law]]
id = "ATT-X4"
class = "prohibited"
mutation = "move_cohorts"
statement = "A chain link cannot move cohorts; every link retains the complete root tuple, profile, and cohort."
dimension_ids = ["issuer", "token_epoch"]
negative_fixture = "tm_neg_cohort_move"
source_anchor = "§12.2"

[[attenuation_law]]
id = "ATT-X5"
class = "prohibited"
mutation = "weaken_presentation_binding"
statement = "A chain link cannot change Session or Channel binding to a less restrictive class."
dimension_ids = ["presentation_binding"]
negative_fixture = "tm_neg_binding_weakening"
source_anchor = "§12.2"

