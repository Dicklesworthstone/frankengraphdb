# =============================================================================
# threat_model.toml — the deployment-independent threat/trust model (G0)
# =============================================================================
# Bead: fgdb-g0-threat-model-nqd
# Provenance: plan §12.1-§12.2 (threat/authority model, token attenuation law),
# §16 item 8 (external-authority surface), §3.4 (registered rejections),
# §5.1 (IncarnationContinuityProfile), §13.7 (ArchiveReadOnlyOpen), §19 G0.
#
# WHY THIS REGISTRY EXISTS. Every later security mechanism is scoped by the
# frame declared here: no claim may outrun its trust assumptions. FG-INV-20
# ("authorization precedes every observation or effect") is the invariant; this
# registry is the frame in which that invariant's clauses are scoped, and the
# generated document docs/THREAT_AND_TRUST_MODEL.md is its published rendering.
#
# THE THREE LAWS THIS REGISTRY ENFORCES THAT NOTHING ELSE DOES.
#
#   1. Exposure completeness. Every (actor, asset) cell is dispositioned exactly
#      once as defended / conditional / undefended, each naming an assumption.
#      A silently absent cell is the failure mode this law exists to catch: an
#      unstated exposure reads exactly like a defended one.
#   2. Narrowing-only attenuation. The authority lattice has no independent
#      order: its order IS the macaroon attenuation law. Every dimension
#      declares one narrowing operator, and every widening mutation of every
#      dimension has a named negative fixture.
#   3. Posture product-space closure. The registered postures are not a list;
#      they are the admissible cells of a declared product space under named
#      exclusion laws. Every one of the twelve cells is either a registered
#      posture, a deferred posture with a named owner bead, or excluded by an
#      exclusion law that cites its plan anchor.
#
# WHAT THIS REGISTRY DELIBERATELY DOES NOT DO. It does not bind realized
# operation classes to external-authority footprint cells. §16 item 8 states
# where each authority sits on the synchronous path; it does not name which of
# the sixteen operation classes each realized path uses. Inventing that binding
# here would manufacture a G0 fact from a W9 measurement, so every footprint
# cell carries operation_class_basis = "trigger_site_only" and defers the
# realized binding to fgdb-w9-authority-surface-gp9j, which publishes the §16
# table against implemented paths.
# =============================================================================

