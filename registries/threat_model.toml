# -----------------------------------------------------------------------------
# Claim-scan rules. The generated document is scanned for normative sentences
# that exceed the trust matrix. This is LINT EVIDENCE, not a noninterference
# proof, and the distinction is recorded here so nobody later mistakes a green
# scan for a semantic result.
#
# A rule fires when `subject` and `predicate` both occur in one sentence and no
# `qualifier` occurs in that same sentence.
# -----------------------------------------------------------------------------

[[claim_scan_rule]]
id = "TMS-1"
subject = "compromised server"
predicate = "confidential"
# "no normative text may claim" is here because the scan fired on A-NO-TEE's
# own bounds sentence — the sentence that STATES the prohibition. A rule that
# flags its own statement of the rule is noise, and the qualifier list is the
# mechanism for saying so precisely rather than by weakening the subject.
qualifiers = [
  "no tee",
  "cannot",
  "claims no",
  "exfiltrate",
  "not claimed",
  "no normative text may claim",
]
trust_matrix_conflict = "A-NO-TEE: a compromised server process can exfiltrate what it can decrypt."
severity = "fail"

[[claim_scan_rule]]
id = "TMS-2"
subject = "byzantine"
predicate = "tolerat"
qualifiers = ["not", "out of scope", "crash faults", "rejected"]
trust_matrix_conflict = "A-RAFT-CRASH-ONLY: ordinary Raft tolerates crash faults, not Byzantine replicas."
severity = "fail"

[[claim_scan_rule]]
id = "TMS-3"
subject = "noninterference"
predicate = "prove"
qualifiers = ["not", "never", "do not", "does not", "substitutes"]
trust_matrix_conflict = "OOS-NONINTERFERENCE-PROOF: adversarial fixtures do not prove universal noninterference."
severity = "fail"

[[claim_scan_rule]]
id = "TMS-4"
subject = "witness"
predicate = "undo"
qualifiers = ["not", "never", "cannot"]
trust_matrix_conflict = "A-WITNESS-DETECT-ONLY: witnessed transparency detects, and never undoes disclosure."
severity = "fail"
